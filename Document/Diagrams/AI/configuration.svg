<marker id="diamond" markerWidth="14" markerHeight="12" refX="1" refY="6" orient="auto"><path d="M1 6 L7 1 L13 6 L7 11 Z" fill="#5b6b7a"/></marker>
</defs><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#253447} .edge{fill:none;stroke:#5b6b7a;stroke-width:1.4} .lifeline{stroke:#98a5b2;stroke-dasharray:5 5} </style>
<rect width="100%" height="100%" fill="#fff"/><text x="24" y="34" font-size="22" text-anchor="start" font-weight="600">人物与声音配置类图 · 当前实现</text><text x="24" y="65" font-size="13" text-anchor="start" font-weight="400">◆ 拥有组件   → 调用或使用   ⇢ 传递数据   代码名省略 Delivery 前缀，完整名称见正文</text><polyline class="edge" points="445,273.0 375,273.0" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="410.0" cy="273.0" r="11" fill="white" stroke="#bdc9d7"/><text x="410.0" y="277.0" font-size="11" text-anchor="middle" font-weight="400">1</text><polyline class="edge" points="205.0,160 205.0,126 1025.0,126 1025.0,160" marker-end="url(#arrow)"/><circle cx="615.0" cy="126.0" r="11" fill="white" stroke="#bdc9d7"/><text x="615.0" y="130.0" font-size="11" text-anchor="middle" font-weight="400">2</text><polyline class="edge" points="615.0,386 615.0,443.0 205.0,443.0 205.0,500" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="410.0" cy="443.0" r="11" fill="white" stroke="#bdc9d7"/><text x="410.0" y="447.0" font-size="11" text-anchor="middle" font-weight="400">3</text><polyline class="edge" points="615.0,386 615.0,443.0 615.0,500" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="615.0" cy="414.5" r="11" fill="white" stroke="#bdc9d7"/><text x="615.0" y="418.5" font-size="11" text-anchor="middle" font-weight="400">4</text><polyline class="edge" points="615.0,500 615.0,483.0 1025.0,483.0 1025.0,466" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="820.0" cy="483.0" r="11" fill="white" stroke="#bdc9d7"/><text x="820.0" y="487.0" font-size="11" text-anchor="middle" font-weight="400">5</text><polyline class="edge" points="785,613.0 855,613.0" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="820.0" cy="613.0" r="11" fill="white" stroke="#bdc9d7"/><text x="820.0" y="617.0" font-size="11" text-anchor="middle" font-weight="400">6</text><g data-node="FDeliveryNpcProfileRow"><title>FDeliveryNpcProfileRow</title><rect x="35" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 161 H374 V240 H36 Z" fill="#eff4fb"/><text x="47" y="178" font-size="11" text-anchor="start" font-weight="400">«数据表行»</text><text x="363" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="203" font-size="18" text-anchor="start" font-weight="600">NPC 人物配置</text><text x="47" y="225" font-size="12" text-anchor="start" font-weight="400">NpcProfileRow</text><path d="M35 240 H375 M35 296 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="262" font-size="13" text-anchor="start" font-weight="400">DisplayName / Persona：名字与性格</text><text x="47" y="282" font-size="13" text-anchor="start" font-weight="400">TtsVoice / VoiceSet：两类声音配置</text><text x="47" y="319" font-size="13" text-anchor="start" font-weight="400">继承 FTableRowBase</text><text x="47" y="336" font-size="12" text-anchor="start" font-weight="400">DT_NpcProfiles 每行对应一名角色</text><text x="47" y="357" font-size="13" text-anchor="start" font-weight="400">chunlai / xiumei</text><text x="47" y="374" font-size="12" text-anchor="start" font-weight="400">分别配置大壮与翠花</text></g><g data-node="ADeliveryNpcCharacter"><title>ADeliveryNpcCharacter</title><rect x="445" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 161 H784 V240 H446 Z" fill="#eff4fb"/><text x="457" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="203" font-size="18" text-anchor="start" font-weight="600">NPC 角色</text><text x="457" y="225" font-size="12" text-anchor="start" font-weight="400">NpcCharacter</text><path d="M445 240 H785 M445 296 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="262" font-size="13" text-anchor="start" font-weight="400">Profile：选择人物数据表及表行</text><text x="457" y="282" font-size="13" text-anchor="start" font-weight="400">保留原模型、动画和关卡位置</text><text x="457" y="319" font-size="13" text-anchor="start" font-weight="400">ApplyProfile()</text><text x="457" y="336" font-size="12" text-anchor="start" font-weight="400">检查后应用名字、性格和声音</text><text x="457" y="357" font-size="13" text-anchor="start" font-weight="400">未选表或配置无效</text><text x="457" y="374" font-size="12" text-anchor="start" font-weight="400">保留角色原有设置</text></g><g data-node="UDeliveryNpcVoiceSet"><title>UDeliveryNpcVoiceSet</title><rect x="855" y="160" width="340" height="306" fill="white" stroke="#8aa5c6"/><path d="M856 161 H1194 V240 H856 Z" fill="#eff4fb"/><text x="867" y="178" font-size="11" text-anchor="start" font-weight="400">«数据资产»</text><text x="1183" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="203" font-size="18" text-anchor="start" font-weight="600">台词音量与短音配置</text><text x="867" y="225" font-size="12" text-anchor="start" font-weight="400">NpcVoiceSet</text><path d="M855 240 H1195 M855 376 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="262" font-size="13" text-anchor="start" font-weight="400">DialogueVolume：完整台词音量</text><text x="867" y="282" font-size="13" text-anchor="start" font-weight="400">DialogueAttenuation：台词距离衰减</text><text x="867" y="302" font-size="13" text-anchor="start" font-weight="400">ReactionAttenuation：短音距离衰减</text><text x="867" y="322" font-size="13" text-anchor="start" font-weight="400">HeardPlayer / Hit：听见与受击短音</text><text x="867" y="342" font-size="13" text-anchor="start" font-weight="400">StreamingStartBufferSeconds：开播缓冲</text><text x="867" y="362" font-size="13" text-anchor="start" font-weight="400">StreamingResumeBufferSeconds：续播缓冲</text><text x="867" y="399" font-size="13" text-anchor="start" font-weight="400">GetSound(Reaction)</text><text x="867" y="416" font-size="12" text-anchor="start" font-weight="400">查找对应 Sound Wave 或 Sound Cue</text><text x="867" y="437" font-size="13" text-anchor="start" font-weight="400">Volume / Pitch / MaxDuration</text><text x="867" y="454" font-size="12" text-anchor="start" font-weight="400">分别调整短反应音的播放效果</text></g><g data-node="UDeliveryNpcAgentComponent"><title>UDeliveryNpcAgentComponent</title><rect x="35" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 501 H374 V580 H36 Z" fill="#eff4fb"/><text x="47" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="363" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="543" font-size="18" text-anchor="start" font-weight="600">NPC 决策</text><text x="47" y="565" font-size="12" text-anchor="start" font-weight="400">NpcAgentComponent</text><path d="M35 580 H375 M35 636 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="602" font-size="13" text-anchor="start" font-weight="400">保存所见所闻和当前请求</text><text x="47" y="622" font-size="13" text-anchor="start" font-weight="400">记录正在执行的动作</text><text x="47" y="659" font-size="13" text-anchor="start" font-weight="400">RequestDecision()</text><text x="47" y="676" font-size="12" text-anchor="start" font-weight="400">安排一次模型请求</text><text x="47" y="697" font-size="13" text-anchor="start" font-weight="400">StartAction()</text><text x="47" y="714" font-size="12" text-anchor="start" font-weight="400">检查条件并开始动作</text></g><g data-node="UDeliveryNpcPresentationComponent"><title>UDeliveryNpcPresentationComponent</title><rect x="445" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 501 H784 V580 H446 Z" fill="#eff4fb"/><text x="457" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="543" font-size="18" text-anchor="start" font-weight="600">对白与人物表现</text><text x="457" y="565" font-size="12" text-anchor="start" font-weight="400">NpcPresentationComponent</text><path d="M445 580 H785 M445 636 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="602" font-size="13" text-anchor="start" font-weight="400">TtsVoice：后端朗读完整中文台词</text><text x="457" y="622" font-size="13" text-anchor="start" font-weight="400">VoiceSet：台词音量、衰减与短音</text><text x="457" y="659" font-size="13" text-anchor="start" font-weight="400">PlayReaction()</text><text x="457" y="676" font-size="12" text-anchor="start" font-weight="400">服务器按事件编号通知播放</text><text x="457" y="697" font-size="13" text-anchor="start" font-weight="400">StopReaction()</text><text x="457" y="714" font-size="12" text-anchor="start" font-weight="400">正式台词开始或被打断时停声</text></g><g data-node="UDeliveryNpcExpressionSet"><title>UDeliveryNpcExpressionSet</title><rect x="855" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 501 H1194 V580 H856 Z" fill="#eff4fb"/><text x="867" y="518" font-size="11" text-anchor="start" font-weight="400">«数据资产»</text><text x="1183" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="543" font-size="18" text-anchor="start" font-weight="600">表情与交谈姿态配置</text><text x="867" y="565" font-size="12" text-anchor="start" font-weight="400">NpcExpressionSet</text><path d="M855 580 H1195 M855 636 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="602" font-size="13" text-anchor="start" font-weight="400">保存眼睛、眉毛和眨眼曲线</text><text x="867" y="622" font-size="13" text-anchor="start" font-weight="400">保存倾听时长、前倾和头部过渡参数</text><text x="867" y="659" font-size="13" text-anchor="start" font-weight="400">Poses / BlinkCurve</text><text x="867" y="676" font-size="12" text-anchor="start" font-weight="400">按情绪选择形态键权重</text><text x="867" y="697" font-size="13" text-anchor="start" font-weight="400">ListeningReactionDuration</text><text x="867" y="714" font-size="12" text-anchor="start" font-weight="400">短暂倾听后进入等待姿态</text></g><text x="35" y="790" font-size="13" text-anchor="start" font-weight="400">01  通过 Profile 选择数据表和行</text><text x="645" y="790" font-size="13" text-anchor="start" font-weight="400">02  VoiceSet 字段引用声音配置</text><text x="35" y="816" font-size="13" text-anchor="start" font-weight="400">03  ApplyProfile 更新人物性格</text><text x="645" y="816" font-size="13" text-anchor="start" font-weight="400">04  ApplyProfile 更新两类声音配置</text><text x="35" y="842" font-size="13" text-anchor="start" font-weight="400">05  读取台词音量与衰减，按事件选择短音</text><text x="645" y="842" font-size="13" text-anchor="start" font-weight="400">06  读取表情与交谈姿态，保持原配置</text></svg>