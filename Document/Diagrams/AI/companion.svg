<rect width="100%" height="100%" fill="#fff"/><text x="24" y="34" font-size="22" text-anchor="start" font-weight="600">二狗类图 · 后续设计，尚未实现</text><text x="24" y="65" font-size="13" text-anchor="start" font-weight="400">◆ 拥有组件   → 调用或使用   ⇢ 传递数据   代码名省略 Delivery 前缀，完整名称见正文</text><polyline class="edge" points="375,254.0 445,254.0" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="410.0" cy="254.0" r="11" fill="white" stroke="#bdc9d7"/><text x="410.0" y="258.0" font-size="11" text-anchor="middle" font-weight="400">1</text><polyline class="edge" points="785,273.0 855,273.0" marker-end="url(#arrow)" marker-start="url(#diamond)"/><circle cx="820.0" cy="273.0" r="11" fill="white" stroke="#bdc9d7"/><text x="820.0" y="277.0" font-size="11" text-anchor="middle" font-weight="400">2</text><polyline class="edge" points="615.0,386 615.0,443.0 205.0,443.0 205.0,500" marker-end="url(#arrow)" marker-start="url(#diamond)"/><circle cx="410.0" cy="443.0" r="11" fill="white" stroke="#bdc9d7"/><text x="410.0" y="447.0" font-size="11" text-anchor="middle" font-weight="400">3</text><polyline class="edge" points="1025.0,386 1025.0,443.0 205.0,443.0 205.0,500" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="615.0" cy="443.0" r="11" fill="white" stroke="#bdc9d7"/><text x="615.0" y="447.0" font-size="11" text-anchor="middle" font-weight="400">4</text><polyline class="edge" points="375,594.0 445,594.0" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="410.0" cy="594.0" r="11" fill="white" stroke="#bdc9d7"/><text x="410.0" y="598.0" font-size="11" text-anchor="middle" font-weight="400">5</text><polyline class="edge" points="205.0,500 205.0,466 1025.0,466 1025.0,500" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="615.0" cy="466.0" r="11" fill="white" stroke="#bdc9d7"/><text x="615.0" y="470.0" font-size="11" text-anchor="middle" font-weight="400">6</text><polyline class="edge" points="1025.0,500 1025.0,443.0 615.0,443.0 615.0,386" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="820.0" cy="443.0" r="11" fill="white" stroke="#bdc9d7"/><text x="820.0" y="447.0" font-size="11" text-anchor="middle" font-weight="400">7</text><g data-node="UDeliveryConversationComponent"><title>UDeliveryConversationComponent</title><rect x="35" y="160" width="340" height="188" fill="white" stroke="#b99253"/><path d="M36 161 H374 V240 H36 Z" fill="#fff8eb"/><text x="47" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="363" y="178" font-size="11" text-anchor="end" font-weight="400">计划复用</text><text x="47" y="203" font-size="18" text-anchor="start" font-weight="600">玩家交代任务</text><text x="47" y="225" font-size="12" text-anchor="start" font-weight="400">ConversationComponent</text><path d="M35 240 H375 M35 296 H375" stroke="#b99253" stroke-width=".8"/><text x="47" y="262" font-size="13" text-anchor="start" font-weight="400">沿用玩家控制器上的交谈入口</text><text x="47" y="282" font-size="13" text-anchor="start" font-weight="400">跑腿指令需检查是否来自主人</text><text x="47" y="319" font-size="13" text-anchor="start" font-weight="400">Submit() / ServerSubmit()</text><text x="47" y="336" font-size="12" text-anchor="start" font-weight="400">发送原话，服务器检查后交给 NPC</text></g><g data-node="ADeliveryCompanionCharacter"><title>ADeliveryCompanionCharacter</title><rect x="445" y="160" width="340" height="226" fill="white" stroke="#b99253"/><path d="M446 161 H784 V240 H446 Z" fill="#fff8eb"/><text x="457" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="178" font-size="11" text-anchor="end" font-weight="400">计划增加</text><text x="457" y="203" font-size="18" text-anchor="start" font-weight="600">二狗角色</text><text x="457" y="225" font-size="12" text-anchor="start" font-weight="400">CompanionCharacter</text><path d="M445 240 H785 M445 296 H785" stroke="#b99253" stroke-width=".8"/><text x="457" y="262" font-size="13" text-anchor="start" font-weight="400">继承 ADeliveryNpcCharacter</text><text x="457" y="282" font-size="13" text-anchor="start" font-weight="400">沿用 NPC 的战斗、声音和表情</text><text x="457" y="319" font-size="13" text-anchor="start" font-weight="400">拟重写 CanExecute() / ExecuteAction()</text><text x="457" y="336" font-size="12" text-anchor="start" font-weight="400">检查并执行跟随、等候和跑腿动作</text><text x="457" y="357" font-size="13" text-anchor="start" font-weight="400">拟重写 StopAction()</text><text x="457" y="374" font-size="12" text-anchor="start" font-weight="400">停下已经取消的动作</text></g><g data-node="UDeliveryCompanionComponent"><title>UDeliveryCompanionComponent</title><rect x="855" y="160" width="340" height="226" fill="white" stroke="#b99253"/><path d="M856 161 H1194 V240 H856 Z" fill="#fff8eb"/><text x="867" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="1183" y="178" font-size="11" text-anchor="end" font-weight="400">计划增加</text><text x="867" y="203" font-size="18" text-anchor="start" font-weight="600">主人关系与跑腿记录</text><text x="867" y="225" font-size="12" text-anchor="start" font-weight="400">CompanionComponent</text><path d="M855 240 H1195 M855 296 H1195" stroke="#b99253" stroke-width=".8"/><text x="867" y="262" font-size="13" text-anchor="start" font-weight="400">主人 PlayerState、亲密度、跟随状态</text><text x="867" y="282" font-size="13" text-anchor="start" font-weight="400">当前跑腿与手上的快递由服务器保存</text><text x="867" y="319" font-size="13" text-anchor="start" font-weight="400">计划提供归属与跑腿接口</text><text x="867" y="336" font-size="12" text-anchor="start" font-weight="400">具体函数在实现时确定</text><text x="867" y="357" font-size="13" text-anchor="start" font-weight="400">复制主人和当前状态</text><text x="867" y="374" font-size="12" text-anchor="start" font-weight="400">上下车仍属于同一位主人</text></g><g data-node="UDeliveryNpcAgentComponent"><title>UDeliveryNpcAgentComponent</title><rect x="35" y="500" width="340" height="226" fill="white" stroke="#b99253"/><path d="M36 501 H374 V580 H36 Z" fill="#fff8eb"/><text x="47" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="363" y="518" font-size="11" text-anchor="end" font-weight="400">计划复用</text><text x="47" y="543" font-size="18" text-anchor="start" font-weight="600">模型上下文与动作记录</text><text x="47" y="565" font-size="12" text-anchor="start" font-weight="400">NpcAgentComponent</text><path d="M35 580 H375 M35 636 H375" stroke="#b99253" stroke-width=".8"/><text x="47" y="602" font-size="13" text-anchor="start" font-weight="400">记录 NPC 听见的话和现场事件</text><text x="47" y="622" font-size="13" text-anchor="start" font-weight="400">读取跟班组件提供的任务与关系</text><text x="47" y="659" font-size="13" text-anchor="start" font-weight="400">RequestDecision()</text><text x="47" y="676" font-size="12" text-anchor="start" font-weight="400">请模型从当前可用动作中选择</text><text x="47" y="697" font-size="13" text-anchor="start" font-weight="400">TryFinishAction()</text><text x="47" y="714" font-size="12" text-anchor="start" font-weight="400">记录游戏确认的动作结果</text></g><g data-node="UDeliveryAiGatewaySubsystem"><title>UDeliveryAiGatewaySubsystem</title><rect x="445" y="500" width="340" height="188" fill="white" stroke="#b99253"/><path d="M446 501 H784 V580 H446 Z" fill="#fff8eb"/><text x="457" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="518" font-size="11" text-anchor="end" font-weight="400">计划复用</text><text x="457" y="543" font-size="18" text-anchor="start" font-weight="600">请求模型判断</text><text x="457" y="565" font-size="12" text-anchor="start" font-weight="400">AiGatewaySubsystem</text><path d="M445 580 H785 M445 636 H785" stroke="#b99253" stroke-width=".8"/><text x="457" y="602" font-size="13" text-anchor="start" font-weight="400">发送相关事件、关系和可用动作</text><text x="457" y="622" font-size="13" text-anchor="start" font-weight="400">复用已有后端和取消处理</text><text x="457" y="659" font-size="13" text-anchor="start" font-weight="400">Enqueue() / Cancel()</text><text x="457" y="676" font-size="12" text-anchor="start" font-weight="400">安排请求或取消旧请求</text></g><g data-node="BT_Companion"><title>BT_Companion</title><rect x="855" y="500" width="340" height="226" fill="white" stroke="#b99253"/><path d="M856 501 H1194 V580 H856 Z" fill="#fff8eb"/><text x="867" y="518" font-size="11" text-anchor="start" font-weight="400">«蓝图资产»</text><text x="1183" y="518" font-size="11" text-anchor="end" font-weight="400">计划增加</text><text x="867" y="543" font-size="18" text-anchor="start" font-weight="600">二狗行为树蓝图</text><text x="867" y="565" font-size="12" text-anchor="start" font-weight="400">BT_Companion</text><path d="M855 580 H1195 M855 636 H1195" stroke="#b99253" stroke-width=".8"/><text x="867" y="602" font-size="13" text-anchor="start" font-weight="400">从 BT_Resident 扩展跟随与跑腿</text><text x="867" y="622" font-size="13" text-anchor="start" font-weight="400">倒地、取消和目标变化时停止动作</text><text x="867" y="659" font-size="13" text-anchor="start" font-weight="400">复用 BTTask_DeliveryExecuteNpcAction</text><text x="867" y="676" font-size="12" text-anchor="start" font-weight="400">调用角色接口执行模型选定的动作</text><text x="867" y="697" font-size="13" text-anchor="start" font-weight="400">新增跟随与跑腿分支</text><text x="867" y="714" font-size="12" text-anchor="start" font-weight="400">蓝图节点与参数在实现时配置</text></g><text x="35" y="790" font-size="13" text-anchor="start" font-weight="400">01  通过检查的玩家原话交给 NPC</text><text x="645" y="790" font-size="13" text-anchor="start" font-weight="400">02  角色持有跟班组件，由组件保存主人与跑腿状态</text><text x="35" y="816" font-size="13" text-anchor="start" font-weight="400">03  角色沿用 NPC Agent 处理现场信息与模型建议</text><text x="645" y="816" font-size="13" text-anchor="start" font-weight="400">04  将当前任务和主人关系提供给模型上下文</text><text x="35" y="842" font-size="13" text-anchor="start" font-weight="400">05  请求模型判断，接收台词和动作建议</text><text x="645" y="842" font-size="13" text-anchor="start" font-weight="400">06  将游戏检查通过的动作交给行为树</text><text x="35" y="868" font-size="13" text-anchor="start" font-weight="400">07  行为树调用角色的动作接口，结果交回 Agent</text></svg>