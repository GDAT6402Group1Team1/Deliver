 x="47" y="203" font-size="18" text-anchor="start" font-weight="600">交谈界面</text><text x="47" y="225" font-size="12" text-anchor="start" font-weight="400">ConversationWidget</text><path d="M35 240 H375 M35 296 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="262" font-size="13" text-anchor="start" font-weight="400">显示输入框和快捷按钮</text><text x="47" y="282" font-size="13" text-anchor="start" font-weight="400">等待对应发言的回复</text><text x="47" y="319" font-size="13" text-anchor="start" font-weight="400">SendText()</text><text x="47" y="336" font-size="12" text-anchor="start" font-weight="400">提交文字或快捷发言</text><text x="47" y="357" font-size="13" text-anchor="start" font-weight="400">按发言编号显示回复</text><text x="47" y="374" font-size="12" text-anchor="start" font-weight="400">不将 NPC 闲聊当成回答</text></g><g data-node="UDeliveryConversationComponent"><title>UDeliveryConversationComponent</title><rect x="445" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 161 H784 V240 H446 Z" fill="#eff4fb"/><text x="457" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="203" font-size="18" text-anchor="start" font-weight="600">玩家交谈</text><text x="457" y="225" font-size="12" text-anchor="start" font-weight="400">ConversationComponent</text><path d="M445 240 H785 M445 296 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="262" font-size="13" text-anchor="start" font-weight="400">位于玩家控制器上</text><text x="457" y="282" font-size="13" text-anchor="start" font-weight="400">记录发言编号和发送间隔</text><text x="457" y="319" font-size="13" text-anchor="start" font-weight="400">Submit()</text><text x="457" y="336" font-size="12" text-anchor="start" font-weight="400">从玩家本机发送消息</text><text x="457" y="357" font-size="13" text-anchor="start" font-weight="400">ServerSubmit()</text><text x="457" y="374" font-size="12" text-anchor="start" font-weight="400">服务器检查后交给 NPC</text></g><g data-node="FDeliveryNpcDecisionRequest"><title>FDeliveryNpcDecisionRequest</title><rect x="855" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 161 H1194 V240 H856 Z" fill="#eff4fb"/><text x="867" y="178" font-size="11" text-anchor="start" font-weight="400">«传输数据»</text><text x="1183" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="203" font-size="18" text-anchor="start" font-weight="600">模型请求数据</text><text x="867" y="225" font-size="12" text-anchor="start" font-weight="400">NpcDecisionRequest</text><path d="M855 240 H1195 M855 296 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="262" font-size="13" text-anchor="start" font-weight="400">记录 NPC、请求和世界编号</text><text x="867" y="282" font-size="13" text-anchor="start" font-weight="400">包含相关事件及可用动作</text><text x="867" y="319" font-size="13" text-anchor="start" font-weight="400">BuildDecisionRequest()</text><text x="867" y="336" font-size="12" text-anchor="start" font-weight="400">从当前信息中选取请求内容</text><text x="867" y="357" font-size="13" text-anchor="start" font-weight="400">EncodeRequest()</text><text x="867" y="374" font-size="12" text-anchor="start" font-weight="400">转换为后端接收的 JSON</text></g><g data-node="UDeliveryNpcAgentComponent"><title>UDeliveryNpcAgentComponent</title><rect x="35" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 501 H374 V580 H36 Z" fill="#eff4fb"/><text x="47" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="363" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="543" font-size="18" text-anchor="start" font-weight="600">NPC 决策</text><text x="47" y="565" font-size="12" text-anchor="start" font-weight="400">NpcAgentComponent</text><path d="M35 580 H375 M35 636 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="602" font-size="13" text-anchor="start" font-weight="400">记录说话者和玩家发言编号</text><text x="47" y="622" font-size="13" text-anchor="start" font-weight="400">保存当前请求及动作状态</text><text x="47" y="659" font-size="13" text-anchor="start" font-weight="400">BeginListening()</text><text x="47" y="676" font-size="12" text-anchor="start" font-weight="400">玩家插话时结束旧交谈</text><text x="47" y="697" font-size="13" text-anchor="start" font-weight="400">EndListening()</text><text x="47" y="714" font-size="12" text-anchor="start" font-weight="400">清除倾听目标和发言编号</text></g><g data-node="UDeliveryAiGatewaySubsystem"><title>UDeliveryAiGatewaySubsystem</title><rect x="445" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 501 H784 V580 H446 Z" fill="#eff4fb"/><text x="457" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="543" font-size="18" text-anchor="start" font-weight="600">模型网络请求</text><text x="457" y="565" font-size="12" text-anchor="start" font-weight="400">AiGatewaySubsystem</text><path d="M445 580 H785 M445 636 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="602" font-size="13" text-anchor="start" font-weight="400">保存排队和发送中的请求</text><text x="457" y="622" font-size="13" text-anchor="start" font-weight="400">记录超时与所属游戏世界</text><text x="457" y="659" font-size="13" text-anchor="start" font-weight="400">Enqueue()</text><text x="457" y="676" font-size="12" text-anchor="start" font-weight="400">把请求加入队列</text><text x="457" y="697" font-size="13" text-anchor="start" font-weight="400">Cancel()</text><text x="457" y="714" font-size="12" text-anchor="start" font-weight="400">取消这个 NPC 的请求</text></g><g data-node="Scheduler"><title>Scheduler</title><rect x="855" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 501 H1194 V580 H856 Z" fill="#eff4fb"/><text x="867" y="518" font-size="11" text-anchor="start" font-weight="400">«Python 类»</text><text x="1183" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="543" font-size="18" text-anchor="start" font-weight="600">后端请求安排</text><text x="867" y="565" font-size="12" text-anchor="start" font-weight="400">Scheduler</text><path d="M855 580 H1195 M855 636 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="602" font-size="13" text-anchor="start" font-weight="400">队满时玩家替换未开始的闲聊</text><text x="867" y="622" font-size="13" text-anchor="start" font-weight="400">玩家交谈期间暂停新闲聊</text><text x="867" y="659" font-size="13" text-anchor="start" font-weight="400">submit()</text><text x="867" y="676" font-size="12" text-anchor="start" font-weight="400">优先接收并安排玩家消息</text><text x="867" y="697" font-size="13" text-anchor="start" font-weight="400">cancel()</text><text x="867" y="714" font-size="12" text-anchor="start" font-weight="400">排队立即移除，运行等实际结束</text></g><text x="35" y="790" font-size="13" text-anchor="start" font-weight="400">01  发送文字、道歉或拱火台词</text><text x="645" y="790" font-size="13" text-anchor="start" font-weight="400">02  检查后通过 NPC 开始倾听</text><text x="35" y="816" font-size="13" text-anchor="start" font-weight="400">03  bPlayerRequest 标记玩家发言</text><text x="645" y="816" font-size="13" text-anchor="start" font-weight="400">04  加入游戏端请求队列</text><text x="35" y="842" font-size="13" text-anchor="start" font-weight="400">05  逐句 HTTP 请求与取消通知</text></svg>