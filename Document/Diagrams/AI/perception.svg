<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="894" viewBox="0 0 1240 894" role="img" aria-label="环境感知类图 · 当前实现">
<title>环境感知类图 · 当前实现</title><defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5b6b7a"/></marker>
<marker id="diamond" markerWidth="14" markerHeight="12" refX="1" refY="6" orient="auto"><path d="M1 6 L7 1 L13 6 L7 11 Z" fill="#5b6b7a"/></marker>
</defs><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#253447} .edge{fill:none;stroke:#5b6b7a;stroke-width:1.4} .lifeline{stroke:#98a5b2;stroke-dasharray:5 5} </style>
<rect width="100%" height="100%" fill="#fff"/><text x="24" y="34" font-size="22" text-anchor="start" font-weight="600">环境感知类图 · 当前实现</text><text x="24" y="65" font-size="13" text-anchor="start" font-weight="400">◆ 拥有组件   → 调用或使用   ⇢ 传递数据   代码名省略 Delivery 前缀，完整名称见正文</text><polyline class="edge" points="445,273.0 375,273.0" marker-end="url(#arrow)" marker-start="url(#diamond)"/><circle cx="410.0" cy="273.0" r="11" fill="white" stroke="#bdc9d7"/><text x="410.0" y="277.0" font-size="11" text-anchor="middle" font-weight="400">1</text><polyline class="edge" points="785,273.0 855,273.0" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="820.0" cy="273.0" r="11" fill="white" stroke="#bdc9d7"/><text x="820.0" y="277.0" font-size="11" text-anchor="middle" font-weight="400">2</text><polyline class="edge" points="1025.0,386 1025.0,443.0 1025.0,500" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="1025.0" cy="414.5" r="11" fill="white" stroke="#bdc9d7"/><text x="1025.0" y="418.5" font-size="11" text-anchor="middle" font-weight="400">3</text><polyline class="edge" points="615.0,386 615.0,443.0 615.0,500" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="615.0" cy="414.5" r="11" fill="white" stroke="#bdc9d7"/><text x="615.0" y="418.5" font-size="11" text-anchor="middle" font-weight="400">4</text><polyline class="edge" points="445,613.0 375,613.0" marker-end="url(#arrow)" marker-start="url(#diamond)"/><circle cx="410.0" cy="613.0" r="11" fill="white" stroke="#bdc9d7"/><text x="410.0" y="617.0" font-size="11" text-anchor="middle" font-weight="400">5</text><polyline class="edge" points="785,613.0 855,613.0" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="820.0" cy="613.0" r="11" fill="white" stroke="#bdc9d7"/><text x="820.0" y="617.0" font-size="11" text-anchor="middle" font-weight="400">6</text><g data-node="UAIPerceptionComponent"><title>UAIPerceptionComponent</title><rect x="35" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 161 H374 V240 H36 Z" fill="#eff4fb"/><text x="47" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="363" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="203" font-size="18" text-anchor="start" font-weight="600">UE 视听感知</text><text x="47" y="225" font-size="12" text-anchor="start" font-weight="400">UAIPerceptionComponent</text><path d="M35 240 H375 M35 296 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="262" font-size="13" text-anchor="start" font-weight="400">记录感知到的对象</text><text x="47" y="282" font-size="13" text-anchor="start" font-weight="400">提供视觉和听觉通知</text><text x="47" y="319" font-size="13" text-anchor="start" font-weight="400">OnTargetPerceptionUpdated</text><text x="47" y="336" font-size="12" text-anchor="start" font-weight="400">通知目标的感知情况变化</text><text x="47" y="357" font-size="13" text-anchor="start" font-weight="400">GetCurrentlyPerceivedActors()</text><text x="47" y="374" font-size="12" text-anchor="start" font-weight="400">查询目前感知到的对象</text></g><g data-node="ADeliveryNpcAIController"><title>ADeliveryNpcAIController</title><rect x="445" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 161 H784 V240 H446 Z" fill="#eff4fb"/><text x="457" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="203" font-size="18" text-anchor="start" font-weight="600">NPC 控制器</text><text x="457" y="225" font-size="12" text-anchor="start" font-weight="400">NpcAIController</text><path d="M445 240 H785 M445 296 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="262" font-size="13" text-anchor="start" font-weight="400">使用 UE 的视听感知</text><text x="457" y="282" font-size="13" text-anchor="start" font-weight="400">更新行为树需要的条件</text><text x="457" y="319" font-size="13" text-anchor="start" font-weight="400">OnTargetSeenOrHeard()</text><text x="457" y="336" font-size="12" text-anchor="start" font-weight="400">记录发现或失去目标的通知</text><text x="457" y="357" font-size="13" text-anchor="start" font-weight="400">RefreshBlackboard()</text><text x="457" y="374" font-size="12" text-anchor="start" font-weight="400">更新倒地、动作和目标信息</text></g><g data-node="FDeliveryNpcObservation"><title>FDeliveryNpcObservation</title><rect x="855" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 161 H1194 V240 H856 Z" fill="#eff4fb"/><text x="867" y="178" font-size="11" text-anchor="start" font-weight="400">«数据结构»</text><text x="1183" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="203" font-size="18" text-anchor="start" font-weight="600">一次观察</text><text x="867" y="225" font-size="12" text-anchor="start" font-weight="400">NpcObservation</text><path d="M855 240 H1195 M855 296 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="262" font-size="13" text-anchor="start" font-weight="400">保存事件来源和对象</text><text x="867" y="282" font-size="13" text-anchor="start" font-weight="400">保存位置、内容和有效期</text><text x="867" y="319" font-size="13" text-anchor="start" font-weight="400">由感知或玩法代码填写</text><text x="867" y="336" font-size="12" text-anchor="start" font-weight="400">例如听见发言、受到撞击</text><text x="867" y="357" font-size="13" text-anchor="start" font-weight="400">交给 ObserveEvent()</text><text x="867" y="374" font-size="12" text-anchor="start" font-weight="400">检查后加入 NPC 的记录</text></g><g data-node="FDeliveryNpcEvidence"><title>FDeliveryNpcEvidence</title><rect x="35" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 501 H374 V580 H36 Z" fill="#eff4fb"/><text x="47" y="518" font-size="11" text-anchor="start" font-weight="400">«数据结构»</text><text x="363" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="543" font-size="18" text-anchor="start" font-weight="600">NPC 已知事件</text><text x="47" y="565" font-size="12" text-anchor="start" font-weight="400">NpcEvidence</text><path d="M35 580 H375 M35 636 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="602" font-size="13" text-anchor="start" font-weight="400">保存事件编号和描述</text><text x="47" y="622" font-size="13" text-anchor="start" font-weight="400">区分亲眼所见与他人转述</text><text x="47" y="659" font-size="13" text-anchor="start" font-weight="400">由 Agent 保存</text><text x="47" y="676" font-size="12" text-anchor="start" font-weight="400">模型只能使用已知信息</text><text x="47" y="697" font-size="13" text-anchor="start" font-weight="400">超过有效期后移除</text><text x="47" y="714" font-size="12" text-anchor="start" font-weight="400">不把旧位置当作当前位置</text></g><g data-node="UDeliveryNpcAgentComponent"><title>UDeliveryNpcAgentComponent</title><rect x="445" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 501 H784 V580 H446 Z" fill="#eff4fb"/><text x="457" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="543" font-size="18" text-anchor="start" font-weight="600">NPC 决策</text><text x="457" y="565" font-size="12" text-anchor="start" font-weight="400">NpcAgentComponent</text><path d="M445 580 H785 M445 636 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="602" font-size="13" text-anchor="start" font-weight="400">保存所见所闻和当前请求</text><text x="457" y="622" font-size="13" text-anchor="start" font-weight="400">记录正在执行的动作</text><text x="457" y="659" font-size="13" text-anchor="start" font-weight="400">RequestDecision()</text><text x="457" y="676" font-size="12" text-anchor="start" font-weight="400">安排一次模型请求</text><text x="457" y="697" font-size="13" text-anchor="start" font-weight="400">StartAction()</text><text x="457" y="714" font-size="12" text-anchor="start" font-weight="400">检查条件并开始动作</text></g><g data-node="FDeliveryNpcDecisionRequest"><title>FDeliveryNpcDecisionRequest</title><rect x="855" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 501 H1194 V580 H856 Z" fill="#eff4fb"/><text x="867" y="518" font-size="11" text-anchor="start" font-weight="400">«传输数据»</text><text x="1183" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="543" font-size="18" text-anchor="start" font-weight="600">模型请求数据</text><text x="867" y="565" font-size="12" text-anchor="start" font-weight="400">NpcDecisionRequest</text><path d="M855 580 H1195 M855 636 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="602" font-size="13" text-anchor="start" font-weight="400">记录 NPC、请求和世界编号</text><text x="867" y="622" font-size="13" text-anchor="start" font-weight="400">包含相关事件及可用动作</text><text x="867" y="659" font-size="13" text-anchor="start" font-weight="400">BuildDecisionRequest()</text><text x="867" y="676" font-size="12" text-anchor="start" font-weight="400">从当前信息中选取请求内容</text><text x="867" y="697" font-size="13" text-anchor="start" font-weight="400">EncodeRequest()</text><text x="867" y="714" font-size="12" text-anchor="start" font-weight="400">转换为后端接收的 JSON</text></g><text x="35" y="790" font-size="13" text-anchor="start" font-weight="400">01  持有感知组件</text><text x="645" y="790" font-size="13" text-anchor="start" font-weight="400">02  记录这次所见所闻</text><text x="35" y="816" font-size="13" text-anchor="start" font-weight="400">03  准备发送给模型的事件</text><text x="645" y="816" font-size="13" text-anchor="start" font-weight="400">04  ObserveEvent</text><text x="35" y="842" font-size="13" text-anchor="start" font-weight="400">05  保存 NPC 已知的事件</text><text x="645" y="842" font-size="13" text-anchor="start" font-weight="400">06  BuildDecisionRequest</text></svg>