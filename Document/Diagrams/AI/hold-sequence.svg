<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1270" viewBox="0 0 1180 1270" role="img" aria-label="碰撞与拽车时序图 · 当前实现">
<title>碰撞与拽车时序图 · 当前实现</title><defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5b6b7a"/></marker>
<marker id="diamond" markerWidth="14" markerHeight="12" refX="1" refY="6" orient="auto"><path d="M1 6 L7 1 L13 6 L7 11 Z" fill="#5b6b7a"/></marker>
</defs><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#253447} .edge{fill:none;stroke:#5b6b7a;stroke-width:1.4} .lifeline{stroke:#98a5b2;stroke-dasharray:5 5} </style>
<rect width="100%" height="100%" fill="#fff"/><text x="24" y="34" font-size="22" text-anchor="start" font-weight="600">碰撞与拽车时序图 · 当前实现</text><text x="24" y="62" font-size="14" text-anchor="start" font-weight="400">实线：调用 / 请求    虚线：返回 / 通知    绿色注释：执行条件；计划步骤单独标注</text><rect x="5.0" y="83" width="130" height="45" fill="#eaf1fc" stroke="#83a9e7"/><text x="70.0" y="102" font-size="12" text-anchor="middle" font-weight="600">玩家 / 车辆</text><path class="lifeline" d="M70.0 128 V1245"/><rect x="213.0" y="83" width="130" height="45" fill="#eaf1fc" stroke="#83a9e7"/><text x="278.0" y="102" font-size="12" text-anchor="middle" font-weight="600">居民 / Combat</text><path class="lifeline" d="M278.0 128 V1245"/><rect x="421.0" y="83" width="130" height="45" fill="#eaf1fc" stroke="#83a9e7"/><text x="486.0" y="102" font-size="12" text-anchor="middle" font-weight="600">NPC Agent</text><path class="lifeline" d="M486.0 128 V1245"/><rect x="629.0" y="83" width="130" height="45" fill="#eaf1fc" stroke="#83a9e7"/><text x="694.0" y="102" font-size="12" text-anchor="middle" font-weight="600">Gateway / 模型</text><path class="lifeline" d="M694.0 128 V1245"/><rect x="837.0" y="83" width="130" height="45" fill="#eaf1fc" stroke="#83a9e7"/><text x="902.0" y="102" font-size="12" text-anchor="middle" font-weight="600">BT 执行节点</text><path class="lifeline" d="M902.0 128 V1245"/><rect x="1045.0" y="83" width="130" height="45" fill="#eaf1fc" stroke="#83a9e7"/><text x="1110.0" y="102" font-size="12" text-anchor="middle" font-weight="600">VehicleHold</text><path class="lifeline" d="M1110.0 128 V1245"/><path class="edge" d="M70.0 174 H278.0" marker-end="url(#arrow)"/><text x="174.0" y="164" font-size="13" text-anchor="middle" font-weight="400">碰撞 → ReceiveImpactFrom</text><path class="edge" d="M278.0 248 H486.0" marker-end="url(#arrow)"/><text x="382.0" y="238" font-size="13" text-anchor="middle" font-weight="400">记录受击事件并取消当前计划</text><rect x="233.0" y="297" width="922.0" height="38" fill="#f0f7ef" stroke="#9ec79d"/><text x="694.0" y="320" font-size="14" text-anchor="middle" font-weight="400">立即停止对白 / 处理倒地；模型不参与碰撞结算</text><path class="edge" d="M278.0 396 H486.0" marker-end="url(#arrow)"/><text x="382.0" y="386" font-size="13" text-anchor="middle" font-weight="400">恢复后允许重新决策</text><path class="edge" d="M486.0 470 H694.0" marker-end="url(#arrow)"/><text x="590.0" y="460" font-size="13" text-anchor="middle" font-weight="400">RequestDecision：已知对象与合法候选</text><path class="edge" d="M694.0 544 H486.0" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="590.0" y="534" font-size="13" text-anchor="middle" font-weight="400">HoldVehicle 建议（条件允许时）</text><path class="edge" d="M902.0 618 H486.0" marker-end="url(#arrow)"/><text x="694.0" y="608" font-size="13" text-anchor="middle" font-weight="400">StartAction：检查当前目标与动作条件</text><path class="edge" d="M902.0 692 H278.0" marker-end="url(#arrow)"/><text x="590.0" y="682" font-size="13" text-anchor="middle" font-weight="400">ExecuteAction</text><path class="edge" d="M278.0 766 H1110.0" marker-end="url(#arrow)"/><text x="694.0" y="756" font-size="13" text-anchor="middle" font-weight="400">TryHold：校验占用、位置、车速和驾驶者</text><path class="edge" d="M1110.0 840 H70.0" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="590.0" y="830" font-size="13" text-anchor="middle" font-weight="400">复制 Holder；车辆读取 GetSpeedScale</text><path class="edge" d="M70.0 914 H1110.0" marker-end="url(#arrow)"/><text x="590.0" y="904" font-size="13" text-anchor="middle" font-weight="400">UpdateThrottle：持续油门挣脱</text><path class="edge" d="M278.0 988 H1110.0" marker-end="url(#arrow)"/><text x="694.0" y="978" font-size="13" text-anchor="middle" font-weight="400">Release：受击 / 结束 / 超时等路径</text><path class="edge" d="M1110.0 1062 H70.0" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="590.0" y="1052" font-size="13" text-anchor="middle" font-weight="400">清除占用并恢复速度倍率</text><path class="edge" d="M902.0 1136 H486.0" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="694.0" y="1126" font-size="13" text-anchor="middle" font-weight="400">TryFinishAction：记录动作结束；对白另行记录</text><rect x="233.0" y="1185" width="922.0" height="38" fill="#f0f7ef" stroke="#9ec79d"/><text x="694.0" y="1208" font-size="14" text-anchor="middle" font-weight="400">当前未实现单独预约车辆或双手精确贴合车身</text></svg>