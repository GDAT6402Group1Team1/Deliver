e" stroke="#bdc9d7"/><text x="410.0" y="957.0" font-size="11" text-anchor="middle" font-weight="400">7</text><polyline class="edge" points="785,953.0 855,953.0" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="820.0" cy="953.0" r="11" fill="white" stroke="#bdc9d7"/><text x="820.0" y="957.0" font-size="11" text-anchor="middle" font-weight="400">8</text><polyline class="edge" points="615.0,386 615.0,783.0 205.0,783.0 205.0,1180" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="410.0" cy="783.0" r="11" fill="white" stroke="#bdc9d7"/><text x="410.0" y="787.0" font-size="11" text-anchor="middle" font-weight="400">9</text><polyline class="edge" points="375,1293.0 445,1293.0" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="410.0" cy="1293.0" r="11" fill="white" stroke="#bdc9d7"/><text x="410.0" y="1297.0" font-size="11" text-anchor="middle" font-weight="400">10</text><polyline class="edge" points="615.0,1180 615.0,953.0 1025.0,953.0 1025.0,726" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="820.0" cy="953.0" r="11" fill="white" stroke="#bdc9d7"/><text x="820.0" y="957.0" font-size="11" text-anchor="middle" font-weight="400">11</text><g data-node="AppServer"><title>AppServer</title><rect x="35" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 161 H374 V240 H36 Z" fill="#eff4fb"/><text x="47" y="178" font-size="11" text-anchor="start" font-weight="400">«Python 类»</text><text x="363" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="203" font-size="18" text-anchor="start" font-weight="600">本机模型连接</text><text x="47" y="225" font-size="12" text-anchor="start" font-weight="400">AppServer</text><path d="M35 240 H375 M35 296 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="262" font-size="13" text-anchor="start" font-weight="400">取消获确认后保留已有进程</text><text x="47" y="282" font-size="13" text-anchor="start" font-weight="400">每轮建立独立会话并选择模型</text><text x="47" y="319" font-size="13" text-anchor="start" font-weight="400">stream(model=...)</text><text x="47" y="336" font-size="12" text-anchor="start" font-weight="400">指定本次模型并逐步接收文字</text><text x="47" y="357" font-size="13" text-anchor="start" font-weight="400">close()</text><text x="47" y="374" font-size="12" text-anchor="start" font-weight="400">超时或连接异常时关闭进程</text></g><g data-node="SentenceParser"><title>SentenceParser</title><rect x="445" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 161 H784 V240 H446 Z" fill="#eff4fb"/><text x="457" y="178" font-size="11" text-anchor="start" font-weight="400">«Python 类»</text><text x="773" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="203" font-size="18" text-anchor="start" font-weight="600">完整句子检查</text><text x="457" y="225" font-size="12" text-anchor="start" font-weight="400">SentenceParser</text><path d="M445 240 H785 M445 296 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="262" font-size="13" text-anchor="start" font-weight="400">首条结果确定候选动作</text><text x="457" y="282" font-size="13" text-anchor="start" font-weight="400">后续结果只补充台词</text><text x="457" y="319" font-size="13" text-anchor="start" font-weight="400">feed()</text><text x="457" y="336" font-size="12" text-anchor="start" font-weight="400">收集文字并解析完整 JSON</text><text x="457" y="357" font-size="13" text-anchor="start" font-weight="400">line()</text><text x="457" y="374" font-size="12" text-anchor="start" font-weight="400">检查动作与句子后通知后端</text></g><g data-node="SpeechSynthesizer"><title>SpeechSynthesizer</title><rect x="855" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 161 H1194 V240 H856 Z" fill="#eff4fb"/><text x="867" y="178" font-size="11" text-anchor="start" font-weight="400">«Python 类»</text><text x="1183" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="203" font-size="18" text-anchor="start" font-weight="600">小芳的 Windows 语音</text><text x="867" y="225" font-size="12" text-anchor="start" font-weight="400">SpeechSynthesizer</text><path d="M855 240 H1195 M855 296 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="262" font-size="13" text-anchor="start" font-weight="400">female 保留原 SAPI 声音</text><text x="867" y="282" font-size="13" text-anchor="start" font-weight="400">两个合成线程复用各自语音进程</text><text x="867" y="319" font-size="13" text-anchor="start" font-weight="400">prepare()</text><text x="867" y="336" font-size="12" text-anchor="start" font-weight="400">提前准备 Windows 中文声音</text><text x="867" y="357" font-size="13" text-anchor="start" font-weight="400">synthesize()</text><text x="867" y="374" font-size="12" text-anchor="start" font-weight="400">返回一句完整 PCM 音频</text></g><g data-node="UDeliveryNpcAgentComponent"><title>UDeliveryNpcAgentComponent</title><rect x="35" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 501 H374 V580 H36 Z" fill="#eff4fb"/><text x="47" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="363" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="543" font-size="18" text-anchor="start" font-weight="600">NPC 决策</text><text x="47" y="565" font-size="12" text-anchor="start" font-weight="400">NpcAgentComponent</text><path d="M35 580 H375 M35 636 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="602" font-size="13" text-anchor="start" font-weight="400">检查请求、动作和回复编号</text><text x="47" y="622" font-size="13" text-anchor="start" font-weight="400">只接收本次交谈的有效句子</text><text x="47" y="659" font-size="13" text-anchor="start" font-weight="400">ReceiveStreamDecision()</text><text x="47" y="676" font-size="12" text-anchor="start" font-weight="400">检查完整的动作建议</text><text x="47" y="697" font-size="13" text-anchor="start" font-weight="400">ReceiveSentence()</text><text x="47" y="714" font-size="12" text-anchor="start" font-weight="400">把句子交给人物表现组件</text></g><g data-node="UDeliveryAiGatewaySubsystem"><title>UDeliveryAiGatewaySubsystem</title><rect x="445" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 501 H784 V580 H446 Z" fill="#eff4fb"/><text x="457" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="543" font-size="18" text-anchor="start" font-weight="600">模型网络请求</text><text x="457" y="565" font-size="12" text-anchor="start" font-weight="400">AiGatewaySubsystem</text><path d="M445 580 H785 M445 636 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="602" font-size="13" text-anchor="start" font-weight="400">接收动作建议、句子和结束消息</text><text x="457" y="622" font-size="13" text-anchor="start" font-weight="400">取消或结束关卡后忽略旧回复</text><text x="457" y="659" font-size="13" text-anchor="start" font-weight="400">ReadStream()</text><text x="457" y="676" font-size="12" text-anchor="start" font-weight="400">在游戏线程读取完整消息</text><text x="457" y="697" font-size="13" text-anchor="start" font-weight="400">Cancel()</text><text x="457" y="714" font-size="12" text-anchor="start" font-weight="400">停止接收并通知后端取消</text></g><g data-node="FDeliveryNpcSentence"><title>FDeliveryNpcSentence</title><rect x="855" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 501 H1194 V580 H856 Z" fill="#eff4fb"/><text x="867" y="518" font-size="11" text-anchor="start" font-weight="400">«传输数据»</text><text x="1183" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="543" font-size="18" text-anchor="start" font-weight="600">一句台词及语音</text><text x="867" y="565" font-size="12" text-anchor="start" font-weight="400">NpcSentence</text><path d="M855 580 H1195 M855 636 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="602" font-size="13" text-anchor="start" font-weight="400">保存句子序号、文字和情绪</text><text x="867" y="622" font-size="13" text-anchor="start" font-weight="400">保存 PCM 音频及采样率</text><text x="867" y="659" font-size="13" text-anchor="start" font-weight="400">Sequence / Text / Emotion</text><text x="867" y="676" font-size="12" text-anchor="start" font-weight="400">按序播放同一次回复</text><text x="867" y="697" font-size="13" text-anchor="start" font-weight="400">Pcm / SampleRate</text><text x="867" y="714" font-size="12" text-anchor="start" font-weight="400">交给客户端声音播放</text></g><g data-node="UDeliveryNpcPresentationComponent"><title>UDeliveryNpcPresentationComponent</title><rect x="35" y="840" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 841 H374 V920 H36 Z" fill="#eff4fb"/><text x="47" y="858" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="363" y="858" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="883" font-size="18" text-anchor="start" font-weight="600">对白与人物表现</text><text x="47" y="905" font-size="12" text-anchor="start" font-weight="400">NpcPresentationComponent</text><path d="M35 920 H375 M35 976 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="942" font-size="13" text-anchor="start" font-weight="400">安排逐句对白和客户端播放</text><text x="47" y="962" font-size="13" text-anchor="start" font-weight="400">管理声音、字幕、表情和动画</text><text x="47" y="999" font-size="13" text-anchor="start" font-weight="400">QueueSentence()</text><text x="47" y="1016" font-size="12" text-anchor="start" font-weight="400">按序保存这次回复的句子</text><text x="47" y="1037" font-size="13" text-anchor="start" font-weight="400">GetDisplayedSpeech()</text><text x="47" y="1054" font-size="12" text-anchor="start" font-weight="400">读取本机实际播放的句子</text></g><g data-node="FDeliveryNpcLocalVoice"><title>FDeliveryNpcLocalVoice</title><rect x="445" y="840" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 841 H784 V920 H446 Z" fill="#eff4fb"/><text x="457" y="858" font-size="11" text-anchor="start" font-weight="400">«数据结构»</text><text x="773" y="858" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="883" font-size="18" text-anchor="start" font-weight="600">本机待播语音</text><text x="457" y="905" font-size="12" text-anchor="start" font-weight="400">NpcLocalVoice</text><path d="M445 920 H785 M445 976 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="942" font-size="13" text-anchor="start" font-weight="400">保存收到的 Opus 和解码后的声音</text><text x="457" y="962" font-size="13" text-anchor="start" font-weight="400">记录播放进度和本句解码器</text><text x="457" y="999" font-size="13" text-anchor="start" font-weight="400">State / Pcm</text><text x="457" y="1016" font-size="12" text-anchor="start" font-weight="400">文字和声音对应同一句话</text><text x="457" y="1037" font-size="13" text-anchor="start" font-weight="400">QueuedBytes / TotalBytes</text><text x="457" y="1054" font-size="12" text-anchor="start" font-weight="400">判断这句是否已经播放结束</text></g><g data-node="FDeliveryNpcSpeechState"><title>FDeliveryNpcSpeechState</title><rect x="855" y="840" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 841 H1194 V920 H856 Z" fill="#eff4fb"/><text x="867" y="858" font-size="11" text-anchor="start" font-weight="400">«数据结构»</text><text x="1183" y="858" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="883" font-size="18" text-anchor="start" font-weight="600">对白状态</text><text x="867" y="905" font-size="12" text-anchor="start" font-weight="400">NpcSpeechState</text><path d="M855 920 H1195 M855 976 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="942" font-size="13" text-anchor="start" font-weight="400">保存台词、情绪和发言编号</text><text x="867" y="962" font-size="13" text-anchor="start" font-weight="400">保存句子顺序、时间与音频信息</text><text x="867" y="999" font-size="13" text-anchor="start" font-weight="400">Speech / DisplayedSpeech</text><text x="867" y="1016" font-size="12" text-anchor="start" font-weight="400">分别记录安排和本机实际播放</text><text x="867" y="1037" font-size="13" text-anchor="start" font-weight="400">ReplyToEventId / Sequence</text><text x="867" y="1054" font-size="12" text-anchor="start" font-weight="400">对应玩家发言和句子顺序</text></g><g data-node="SpeechQueue"><title>SpeechQueue</title><rect x="35" y="1180" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 1181 H374 V1260 H36 Z" fill="#eff4fb"/><text x="47" y="1198" font-size="11" text-anchor="start" font-weight="400">«Python 类»</text><text x="363" y="1198" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="1223" font-size="18" text-anchor="start" font-weight="600">大军的语音队列</text><text x="47" y="1245" font-size="12" text-anchor="start" font-weight="400">SpeechQueue</text><path d="M35 1260 H375 M35 1316 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="1282" font-size="13" text-anchor="start" font-weight="400">玩家交谈优先于未开始的闲聊</text><text x="47" y="1302" font-size="13" text-anchor="start" font-weight="400">一个 GPU 实例依次合成句子</text><text x="47" y="1339" font-size="13" text-anchor="start" font-weight="400">submit()</text><text x="47" y="1356" font-size="12" text-anchor="start" font-weight="400">按来源安排完整句子</text><text x="47" y="1377" font-size="13" text-anchor="start" font-weight="400">close()</text><text x="47" y="1394" font-size="12" text-anchor="start" font-weight="400">取消排队项并通知当前合成停止</text></g><g data-node="QwenSpeechSynthesizer"><title>QwenSpeechSynthesizer</title><rect x="445" y="1180" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 1181 H784 V1260 H446 Z" fill="#eff4fb"/><text x="457" y="1198" font-size="11" text-anchor="start" font-weight="400">«Python 类»</text><text x="773" y="1198" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="1223" font-size="18" text-anchor="start" font-weight="600">大军的 B 音色</text><text x="457" y="1245" font-size="12" text-anchor="start" font-weight="400">QwenSpeechSynthesizer</text><path d="M445 1260 H785 M445 1316 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="1282" font-size="13" text-anchor="start" font-weight="400">male 使用常驻 Qwen Uncle_Fu</text><text x="457" y="1302" font-size="13" text-anchor="start" font-weight="400">取消获确认后才开始下一句</text><text x="457" y="1339" font-size="13" text-anchor="start" font-weight="400">prepare()</text><text x="457" y="1356" font-size="12" text-anchor="start" font-weight="400">提前加载模型并准备 Graph</text><text x="457" y="1377" font-size="13" text-anchor="start" font-weight="400">synthesize()</text><text x="457" y="1394" font-size="12" text-anchor="start" font-weight="400">生成完整音频，超过 8 秒报错</text></g><text x="35" y="1470" font-size="13" text-anchor="start" font-weight="400">01  模型文字逐步到达</text><text x="645" y="1470" font-size="13" text-anchor="start" font-weight="400">02  小芳的完整句子交给 SAPI</text><text x="35" y="1496" font-size="13" text-anchor="start" font-weight="400">03  返回文本、情绪、PCM 与句子序号</text><text x="645" y="1496" font-size="13" text-anchor="start" font-weight="400">04  整句音频生成后通过 HTTP 发送</text><text x="35" y="1522" font-size="13" text-anchor="start" font-weight="400">05  在游戏线程检查本次请求</text><text x="645" y="1522" font-size="13" text-anchor="start" font-weight="400">06  通过检查后按序安排句子</text><text x="35" y="1548" font-size="13" text-anchor="start" font-weight="400">07  后台压缩 Opus，客户端收到后解码</text><text x="645" y="1548" font-size="13" text-anchor="start" font-weight="400">08  开始播放时更新本机字幕与情绪</text><text x="35" y="1574" font-size="13" text-anchor="start" font-weight="400">09  大军的完整句子按优先级排队</text><text x="645" y="1574" font-size="13" text-anchor="start" font-weight="400">10  前一句结束或确认取消后调用</text><text x="35" y="1600" font-size="13" text-anchor="start" font-weight="400">11  返回完整 PCM，过长则明确失败</text></svg>