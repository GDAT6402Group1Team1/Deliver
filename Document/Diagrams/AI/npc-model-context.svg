<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" id="svg-npc-model-context" aria-labelledby="npc-model-context-title npc-model-context-description">
  <title id="npc-model-context-title">人物配置如何进入模型请求</title>
  <desc id="npc-model-context-description">人物和关系 JSON 通过后端函数读取，加入 Luna 对话或居民小模型的当前请求。这些都是配置和 Python 函数，没有新增 Unreal 组件。</desc>
  <defs>
    <marker id="context-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#657b94" stroke-width="1.5"/></marker>
    <style>#svg-npc-model-context text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#25374c}#svg-npc-model-context .title{font-size:21px;font-weight:700}#svg-npc-model-context .meta{font-size:14px;fill:#64758a}#svg-npc-model-context .body{font-size:16px}#svg-npc-model-context .code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:15px}#svg-npc-model-context .line{fill:none;stroke:#657b94;stroke-width:1.7;marker-end:url(#context-arrow)}#svg-npc-model-context .box{fill:#fff;stroke:#a5b9cf;stroke-width:1.4}#svg-npc-model-context .head{fill:#eaf1f8}</style>
  </defs>
  <rect width="1100" height="480" fill="#fff"/>
  <path class="line" d="M310 207 H375"/>
  <path class="line" d="M735 207 H800"/>
  <g>
    <rect class="box" x="30" y="40" width="280" height="335" rx="8"/>
    <path class="head" d="M38 41 H302 Q309 41 309 49 V109 H31 V49 Q31 41 38 41"/>
    <text class="meta" x="50" y="66">配置文件 · JSON</text>
    <text class="title" x="50" y="95">人物与关系</text>
    <line x1="30" y1="110" x2="310" y2="110" stroke="#c0cddd"/>
    <text class="code" x="50" y="148">NpcProfiles.json</text>
    <text class="body" x="50" y="177">背景、说话示例、战斗偏好</text>
    <line x1="50" y1="203" x2="290" y2="203" stroke="#d8e1eb"/>
    <text class="code" x="50" y="240">NpcRelationships.json</text>
    <text class="body" x="50" y="269">熟悉、信任、较劲、关照</text>
    <text class="body" x="50" y="300">分别记录“我怎么看他”</text>
    <text class="meta" x="50" y="350">按 profile_id 关联人物</text>
  </g>
  <g>
    <rect class="box" x="375" y="40" width="360" height="335" rx="8"/>
    <path class="head" d="M383 41 H727 Q734 41 734 49 V109 H376 V49 Q376 41 383 41"/>
    <text class="meta" x="395" y="66">后端函数 · Python</text>
    <text class="title" x="395" y="95">为当前人物准备资料</text>
    <line x1="375" y1="110" x2="735" y2="110" stroke="#c0cddd"/>
    <text class="code" x="395" y="145">character_relationships(profile_id)</text>
    <text class="body" x="395" y="172">读取这个人对其他人的态度</text>
    <line x1="395" y1="193" x2="715" y2="193" stroke="#d8e1eb"/>
    <text class="code" x="395" y="221">character_background(context)</text>
    <text class="body" x="395" y="248">合并背景、战斗偏好与关系</text>
    <line x1="395" y1="269" x2="715" y2="269" stroke="#d8e1eb"/>
    <text class="code" x="395" y="297">prepare_runtime_combat_context()</text>
    <text class="body" x="395" y="324">为小模型加入同一份人物资料</text>
    <text class="meta" x="395" y="350">未配置的关系不加入请求</text>
  </g>
  <g>
    <rect class="box" x="800" y="40" width="270" height="335" rx="8"/>
    <path class="head" d="M808 41 H1062 Q1069 41 1069 49 V109 H801 V49 Q801 41 808 41"/>
    <text class="meta" x="820" y="66">模型请求</text>
    <text class="title" x="820" y="95">结合现场作出决定</text>
    <line x1="800" y1="110" x2="1070" y2="110" stroke="#c0cddd"/>
    <text class="code" x="820" y="148">Luna</text>
    <text class="body" x="820" y="177">玩家与 NPC 对话、初次挑衅</text>
    <text class="body" x="820" y="207">二狗的语言与行动选择</text>
    <line x1="820" y1="232" x2="1050" y2="232" stroke="#d8e1eb"/>
    <text class="code" x="820" y="267">Qwen3-1.7B</text>
    <text class="body" x="820" y="296">大壮、翠花的持续交战</text>
    <text class="body" x="820" y="326">继续追打、逃跑或停手</text>
  </g>
  <rect x="30" y="403" width="1040" height="54" rx="8" fill="#f3f6fa"/>
  <text class="body" x="550" y="437" text-anchor="middle">当前观察、对话、真实受击和合法动作一并提供；游戏服务器检查并执行模型建议</text>
</svg>
