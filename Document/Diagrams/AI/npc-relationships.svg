<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" id="svg-npc-relationships" aria-labelledby="npc-relationships-title npc-relationships-description">
  <title id="npc-relationships-title">大壮、翠花与牛二狗的基础关系</title>
  <desc id="npc-relationships-description">三个框对应人物配置。大壮与翠花熟悉但互不服气，两人和二狗都是附近街坊。每对人物分别配置各自的态度，两个方向的数值不必相同。</desc>
  <defs>
    <marker id="relationship-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#657b94" stroke-width="1.5"/></marker>
    <style>#svg-npc-relationships text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#25374c}#svg-npc-relationships .title{font-size:23px;font-weight:700}#svg-npc-relationships .meta{font-size:14px;fill:#64758a}#svg-npc-relationships .body{font-size:17px}#svg-npc-relationships .label{font-size:16px}#svg-npc-relationships .line{fill:none;stroke:#657b94;stroke-width:1.7;marker-start:url(#relationship-arrow);marker-end:url(#relationship-arrow)}#svg-npc-relationships .box{fill:#fff;stroke:#a5b9cf;stroke-width:1.4}#svg-npc-relationships .head{fill:#eaf1f8}</style>
  </defs>
  <rect width="1100" height="530" fill="#fff"/>
  <path class="line" d="M320 112 H780"/>
  <path class="line" d="M180 190 V390 H410"/>
  <path class="line" d="M920 190 V390 H690"/>
  <text class="label" x="550" y="83" text-anchor="middle">老邻居，爱聊天，也爱争个输赢</text>
  <text class="meta" x="550" y="146" text-anchor="middle">两个人分别保存自己的态度</text>
  <rect x="20" y="236" width="370" height="76" rx="8" fill="#f6f8fb"/>
  <text class="label" x="205" y="267" text-anchor="middle">大壮：偶尔逗他，也愿意搭把手</text>
  <text class="label" x="205" y="294" text-anchor="middle">二狗：认识，碰见会打招呼</text>
  <rect x="710" y="236" width="370" height="76" rx="8" fill="#f6f8fb"/>
  <text class="label" x="895" y="267" text-anchor="middle">翠花：觉得他实在，愿意问问难处</text>
  <text class="label" x="895" y="294" text-anchor="middle">二狗：遇到不懂的事愿意问她</text>
  <g>
    <rect class="box" x="40" y="40" width="280" height="150" rx="8"/>
    <path class="head" d="M48 41 H312 Q319 41 319 49 V99 H41 V49 Q41 41 48 41"/>
    <line x1="40" y1="100" x2="320" y2="100" stroke="#c0cddd"/>
    <text class="title" x="60" y="76">大壮</text><text class="meta" x="300" y="76" text-anchor="end">chunlai</text>
    <text class="body" x="60" y="130">好面子，爱显摆</text>
    <text class="body" x="60" y="161">不服翠花，也会照应二狗</text>
  </g>
  <g>
    <rect class="box" x="780" y="40" width="280" height="150" rx="8"/>
    <path class="head" d="M788 41 H1052 Q1059 41 1059 49 V99 H781 V49 Q781 41 788 41"/>
    <line x1="780" y1="100" x2="1060" y2="100" stroke="#c0cddd"/>
    <text class="title" x="800" y="76">翠花</text><text class="meta" x="1040" y="76" text-anchor="end">xiumei</text>
    <text class="body" x="800" y="130">嘴快，好胜，做事直接</text>
    <text class="body" x="800" y="161">爱拆大壮的台，愿意帮二狗</text>
  </g>
  <g>
    <rect class="box" x="410" y="330" width="280" height="150" rx="8"/>
    <path class="head" d="M418 331 H682 Q689 331 689 339 V389 H411 V339 Q411 331 418 331"/>
    <line x1="410" y1="390" x2="690" y2="390" stroke="#c0cddd"/>
    <text class="title" x="430" y="366">牛二狗</text><text class="meta" x="670" y="366" text-anchor="end">ergou</text>
    <text class="body" x="430" y="420">年轻街坊，愿意帮忙</text>
    <text class="body" x="430" y="451">主人和同行安排由本局确认</text>
  </g>
  <text class="meta" x="550" y="516" text-anchor="middle">基础关系来自 NpcRelationships.json；眼前发生的事由游戏另行提供</text>
</svg>
