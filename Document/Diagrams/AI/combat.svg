203" font-size="18" text-anchor="start" font-weight="600">动作执行任务</text><text x="47" y="225" font-size="12" text-anchor="start" font-weight="400">BTTask_ExecuteNpcAction</text><path d="M35 240 H375 M35 296 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="262" font-size="13" text-anchor="start" font-weight="400">保存本次动作编号</text><text x="47" y="282" font-size="13" text-anchor="start" font-weight="400">记录目标和结束时间</text><text x="47" y="319" font-size="13" text-anchor="start" font-weight="400">ExecuteTask()</text><text x="47" y="336" font-size="12" text-anchor="start" font-weight="400">开始执行行为树任务</text><text x="47" y="357" font-size="13" text-anchor="start" font-weight="400">AbortTask()</text><text x="47" y="374" font-size="12" text-anchor="start" font-weight="400">中止任务并停止对应动作</text></g><g data-node="ADeliveryNpcCharacter"><title>ADeliveryNpcCharacter</title><rect x="445" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 161 H784 V240 H446 Z" fill="#eff4fb"/><text x="457" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="203" font-size="18" text-anchor="start" font-weight="600">NPC 角色</text><text x="457" y="225" font-size="12" text-anchor="start" font-weight="400">NpcCharacter</text><path d="M445 240 H785 M445 296 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="262" font-size="13" text-anchor="start" font-weight="400">创建决策、战斗和表现组件</text><text x="457" y="282" font-size="13" text-anchor="start" font-weight="400">保存当前执行的动作编号</text><text x="457" y="319" font-size="13" text-anchor="start" font-weight="400">HearSpeech()</text><text x="457" y="336" font-size="12" text-anchor="start" font-weight="400">接收玩家或其他 NPC 的话</text><text x="457" y="357" font-size="13" text-anchor="start" font-weight="400">ExecuteAction()</text><text x="457" y="374" font-size="12" text-anchor="start" font-weight="400">按动作类型调用相应功能</text></g><g data-node="UDeliveryNpcCombatComponent"><title>UDeliveryNpcCombatComponent</title><rect x="855" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 161 H1194 V240 H856 Z" fill="#eff4fb"/><text x="867" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="1183" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="203" font-size="18" text-anchor="start" font-weight="600">NPC 战斗</text><text x="867" y="225" font-size="12" text-anchor="start" font-weight="400">NpcCombatComponent</text><path d="M855 240 H1195 M855 296 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="262" font-size="13" text-anchor="start" font-weight="400">保存攻击目标和命中时间</text><text x="867" y="282" font-size="13" text-anchor="start" font-weight="400">记录倒地和恢复状态</text><text x="867" y="319" font-size="13" text-anchor="start" font-weight="400">StartStrike()</text><text x="867" y="336" font-size="12" text-anchor="start" font-weight="400">检查条件后开始挥拳</text><text x="867" y="357" font-size="13" text-anchor="start" font-weight="400">ReceiveImpact()</text><text x="867" y="374" font-size="12" text-anchor="start" font-weight="400">处理受击、倒地和恢复</text></g><g data-node="UDeliveryNpcAgentComponent"><title>UDeliveryNpcAgentComponent</title><rect x="35" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 501 H374 V580 H36 Z" fill="#eff4fb"/><text x="47" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="363" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="543" font-size="18" text-anchor="start" font-weight="600">NPC 决策</text><text x="47" y="565" font-size="12" text-anchor="start" font-weight="400">NpcAgentComponent</text><path d="M35 580 H375 M35 636 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="602" font-size="13" text-anchor="start" font-weight="400">保存所见所闻和当前请求</text><text x="47" y="622" font-size="13" text-anchor="start" font-weight="400">记录正在执行的动作</text><text x="47" y="659" font-size="13" text-anchor="start" font-weight="400">RequestDecision()</text><text x="47" y="676" font-size="12" text-anchor="start" font-weight="400">安排一次模型请求</text><text x="47" y="697" font-size="13" text-anchor="start" font-weight="400">StartAction()</text><text x="47" y="714" font-size="12" text-anchor="start" font-weight="400">检查条件并开始动作</text></g><g data-node="UDeliveryVehicleHoldComponent"><title>UDeliveryVehicleHoldComponent</title><rect x="445" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 501 H784 V580 H446 Z" fill="#eff4fb"/><text x="457" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="543" font-size="18" text-anchor="start" font-weight="600">车辆拽车处理</text><text x="457" y="565" font-size="12" text-anchor="start" font-weight="400">VehicleHoldComponent</text><path d="M445 580 H785 M445 636 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="602" font-size="13" text-anchor="start" font-weight="400">记录拽住车辆的 NPC</text><text x="457" y="622" font-size="13" text-anchor="start" font-weight="400">记录拽车和持续油门时间</text><text x="457" y="659" font-size="13" text-anchor="start" font-weight="400">TryHold()</text><text x="457" y="676" font-size="12" text-anchor="start" font-weight="400">检查条件后建立拽车关系</text><text x="457" y="697" font-size="13" text-anchor="start" font-weight="400">Release()</text><text x="457" y="714" font-size="12" text-anchor="start" font-weight="400">松手并恢复正常速度倍率</text></g><g data-node="ADeliveryMotorbike"><title>ADeliveryMotorbike</title><rect x="855" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 501 H1194 V580 H856 Z" fill="#eff4fb"/><text x="867" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="1183" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="543" font-size="18" text-anchor="start" font-weight="600">电瓶车</text><text x="867" y="565" font-size="12" text-anchor="start" font-weight="400">Motorbike</text><path d="M855 580 H1195 M855 636 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="602" font-size="13" text-anchor="start" font-weight="400">处理驾驶与车辆移动</text><text x="867" y="622" font-size="13" text-anchor="start" font-weight="400">持有拽车处理组件</text><text x="867" y="659" font-size="13" text-anchor="start" font-weight="400">读取 GetSpeedScale()</text><text x="867" y="676" font-size="12" text-anchor="start" font-weight="400">根据拽车状态调整速度</text><text x="867" y="697" font-size="13" text-anchor="start" font-weight="400">调用 UpdateThrottle()</text><text x="867" y="714" font-size="12" text-anchor="start" font-weight="400">累计油门时间以便挣脱</text></g><text x="35" y="790" font-size="13" text-anchor="start" font-weight="400">01  ExecuteAction</text><text x="645" y="790" font-size="13" text-anchor="start" font-weight="400">02  持有战斗组件</text><text x="35" y="816" font-size="13" text-anchor="start" font-weight="400">03  TryFinishAction</text><text x="645" y="816" font-size="13" text-anchor="start" font-weight="400">04  请求拽车或松手</text><text x="35" y="842" font-size="13" text-anchor="start" font-weight="400">05  车辆创建拽车处理组件</text></svg>