="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 161 H374 V240 H36 Z" fill="#eff4fb"/><text x="47" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="363" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="203" font-size="18" text-anchor="start" font-weight="600">NPC 角色</text><text x="47" y="225" font-size="12" text-anchor="start" font-weight="400">NpcCharacter</text><path d="M35 240 H375 M35 296 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="262" font-size="13" text-anchor="start" font-weight="400">创建决策、战斗和表现组件</text><text x="47" y="282" font-size="13" text-anchor="start" font-weight="400">保存当前执行的动作编号</text><text x="47" y="319" font-size="13" text-anchor="start" font-weight="400">HearSpeech()</text><text x="47" y="336" font-size="12" text-anchor="start" font-weight="400">接收玩家或其他 NPC 的话</text><text x="47" y="357" font-size="13" text-anchor="start" font-weight="400">ExecuteAction()</text><text x="47" y="374" font-size="12" text-anchor="start" font-weight="400">按动作类型调用相应功能</text></g><g data-node="UDeliveryNpcCombatComponent"><title>UDeliveryNpcCombatComponent</title><rect x="445" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 161 H784 V240 H446 Z" fill="#eff4fb"/><text x="457" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="203" font-size="18" text-anchor="start" font-weight="600">NPC 战斗</text><text x="457" y="225" font-size="12" text-anchor="start" font-weight="400">NpcCombatComponent</text><path d="M445 240 H785 M445 296 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="262" font-size="13" text-anchor="start" font-weight="400">保存攻击目标和命中时间</text><text x="457" y="282" font-size="13" text-anchor="start" font-weight="400">记录倒地和恢复状态</text><text x="457" y="319" font-size="13" text-anchor="start" font-weight="400">StartStrike()</text><text x="457" y="336" font-size="12" text-anchor="start" font-weight="400">检查条件后开始挥拳</text><text x="457" y="357" font-size="13" text-anchor="start" font-weight="400">ReceiveImpact()</text><text x="457" y="374" font-size="12" text-anchor="start" font-weight="400">处理受击、倒地和恢复</text></g><g data-node="UDeliveryNpcBodyAnimInstance"><title>UDeliveryNpcBodyAnimInstance</title><rect x="855" y="160" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 161 H1194 V240 H856 Z" fill="#eff4fb"/><text x="867" y="178" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="1183" y="178" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="203" font-size="18" text-anchor="start" font-weight="600">主动作参数</text><text x="867" y="225" font-size="12" text-anchor="start" font-weight="400">NpcBodyAnimInstance</text><path d="M855 240 H1195 M855 296 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="262" font-size="13" text-anchor="start" font-weight="400">读取角色速度、动作与开始时间</text><text x="867" y="282" font-size="13" text-anchor="start" font-weight="400">按当前人物配置选择动画片段</text><text x="867" y="319" font-size="13" text-anchor="start" font-weight="400">NativeUpdateAnimation()</text><text x="867" y="336" font-size="12" text-anchor="start" font-weight="400">在游戏线程准备动画所需数值</text><text x="867" y="357" font-size="13" text-anchor="start" font-weight="400">StrikeTime / DownTime / GetUpTime</text><text x="867" y="374" font-size="12" text-anchor="start" font-weight="400">使用服务器时间接上当前动作</text></g><g data-node="UDeliveryNpcPresentationComponent"><title>UDeliveryNpcPresentationComponent</title><rect x="35" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 501 H374 V580 H36 Z" fill="#eff4fb"/><text x="47" y="518" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="363" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="543" font-size="18" text-anchor="start" font-weight="600">对白与人物表现</text><text x="47" y="565" font-size="12" text-anchor="start" font-weight="400">NpcPresentationComponent</text><path d="M35 580 H375 M35 636 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="602" font-size="13" text-anchor="start" font-weight="400">安排逐句对白和客户端播放</text><text x="47" y="622" font-size="13" text-anchor="start" font-weight="400">管理声音、字幕、表情和动画</text><text x="47" y="659" font-size="13" text-anchor="start" font-weight="400">QueueSentence()</text><text x="47" y="676" font-size="12" text-anchor="start" font-weight="400">按序保存这次回复的句子</text><text x="47" y="697" font-size="13" text-anchor="start" font-weight="400">GetDisplayedSpeech()</text><text x="47" y="714" font-size="12" text-anchor="start" font-weight="400">读取本机实际播放的句子</text></g><g data-node="ABP_NpcBody"><title>ABP_NpcBody</title><rect x="445" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 501 H784 V580 H446 Z" fill="#eff4fb"/><text x="457" y="518" font-size="11" text-anchor="start" font-weight="400">«蓝图资产»</text><text x="773" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="543" font-size="18" text-anchor="start" font-weight="600">主动画蓝图</text><text x="457" y="565" font-size="12" text-anchor="start" font-weight="400">ABP_NpcBody</text><path d="M445 580 H785 M445 636 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="602" font-size="13" text-anchor="start" font-weight="400">九种动作在图中平滑切换</text><text x="457" y="622" font-size="13" text-anchor="start" font-weight="400">走路、踱步和快步使用同步组</text><text x="457" y="659" font-size="13" text-anchor="start" font-weight="400">Blend Poses by Int</text><text x="457" y="676" font-size="12" text-anchor="start" font-weight="400">按动作编号混合姿势</text><text x="457" y="697" font-size="13" text-anchor="start" font-weight="400">Sequence Evaluator</text><text x="457" y="714" font-size="12" text-anchor="start" font-weight="400">按时间显示挥拳、倒地和起身</text></g><g data-node="ABP_NpcConversation"><title>ABP_NpcConversation</title><rect x="855" y="500" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 501 H1194 V580 H856 Z" fill="#eff4fb"/><text x="867" y="518" font-size="11" text-anchor="start" font-weight="400">«蓝图资产»</text><text x="1183" y="518" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="543" font-size="18" text-anchor="start" font-weight="600">交谈动画蓝图</text><text x="867" y="565" font-size="12" text-anchor="start" font-weight="400">ABP_NpcConversation</text><path d="M855 580 H1195 M855 636 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="602" font-size="13" text-anchor="start" font-weight="400">保留原动作，调整 Spine2 与 Head</text><text x="867" y="622" font-size="13" text-anchor="start" font-weight="400">仅用于两份独立 Face 网格</text><text x="867" y="659" font-size="13" text-anchor="start" font-weight="400">LookAt / ModifyBone 节点</text><text x="867" y="676" font-size="12" text-anchor="start" font-weight="400">跟随视线并叠加前倾和侧头</text><text x="867" y="697" font-size="13" text-anchor="start" font-weight="400">姿态权重降到零</text><text x="867" y="714" font-size="12" text-anchor="start" font-weight="400">挥拳、倒地、拽车时退出</text></g><text x="35" y="790" font-size="13" text-anchor="start" font-weight="400">01  角色持有战斗组件</text><text x="645" y="790" font-size="13" text-anchor="start" font-weight="400">02  提供挥拳、倒地与起身的开始时间</text><text x="35" y="816" font-size="13" text-anchor="start" font-weight="400">03  提供速度和当前动作</text><text x="645" y="816" font-size="13" text-anchor="start" font-weight="400">04  提供动画配置和本机正在说的话</text><text x="35" y="842" font-size="13" text-anchor="start" font-weight="400">05  更新动作编号、步频和播放时间</text><text x="645" y="842" font-size="13" text-anchor="start" font-weight="400">06  先得到身体姿势，再叠加转头和倾听</text></svg>