<rect width="100%" height="100%" fill="#fff"/><text x="24" y="34" font-size="22" text-anchor="start" font-weight="600">Delivery NPC AI 系统类图 · 当前实现</text><text x="24" y="65" font-size="13" text-anchor="start" font-weight="400">◆ 拥有组件   → 调用或使用   ⇢ 传递数据   代码名省略 Delivery 前缀，完整名称见正文</text><rect x="20" y="90" width="1200" height="935" rx="3" fill="#f8fafc" stroke="#dce3eb"/><text x="34" y="114" font-size="12" text-anchor="start" font-weight="600">游戏服务器：检查条件并控制 NPC</text><rect x="20" y="1040" width="450" height="300" rx="3" fill="#f8fafc" stroke="#dce3eb"/><text x="34" y="1064" font-size="12" text-anchor="start" font-weight="600">玩家客户端：通过控制器发送消息</text><rect x="510" y="1040" width="710" height="300" rx="3" fill="#f8fafc" stroke="#dce3eb"/><text x="524" y="1064" font-size="12" text-anchor="start" font-weight="600">AI 后端：调用模型，返回台词和动作建议</text><polyline class="edge" points="70,1203.0 15,1203.0 15,533.0 445,533.0" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="15.0" cy="868.0" r="11" fill="white" stroke="#bdc9d7"/><text x="15.0" y="872.0" font-size="11" text-anchor="middle" font-weight="400">1</text><polyline class="edge" points="615.0,376 615.0,398.0 615.0,420" marker-end="url(#arrow)"/><circle cx="615.0" cy="387.0" r="11" fill="white" stroke="#bdc9d7"/><text x="615.0" y="391.0" font-size="11" text-anchor="middle" font-weight="400">2</text><polyline class="edge" points="615.0,646 615.0,705.5 205.0,705.5 205.0,765" marker-end="url(#arrow)" marker-start="url(#diamond)"/><circle cx="410.0" cy="705.5" r="11" fill="white" stroke="#bdc9d7"/><text x="410.0" y="709.5" font-size="11" text-anchor="middle" font-weight="400">3</text><polyline class="edge" points="375,878.0 445,878.0" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="410.0" cy="878.0" r="11" fill="white" stroke="#bdc9d7"/><text x="410.0" y="882.0" font-size="11" text-anchor="middle" font-weight="400">4</text><polyline class="edge" points="615.0,991 615.0,1045 990.0,1045 990.0,1090" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="802.5" cy="1045.0" r="11" fill="white" stroke="#bdc9d7"/><text x="802.5" y="1049.0" font-size="11" text-anchor="middle" font-weight="400">5</text><polyline class="edge" points="205.0,765 205.0,710 1025.0,710 1025.0,765" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="615.0" cy="710.0" r="11" fill="white" stroke="#bdc9d7"/><text x="615.0" y="714.0" font-size="11" text-anchor="middle" font-weight="400">6</text><polyline class="edge" points="855,533.0 817,533.0 817,735 205.0,735 205.0,765" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="511.0" cy="735.0" r="11" fill="white" stroke="#bdc9d7"/><text x="511.0" y="739.0" font-size="11" text-anchor="middle" font-weight="400">7</text><polyline class="edge" points="1025.0,376 1025.0,398.0 1025.0,420" marker-end="url(#arrow)" stroke-dasharray="6 4"/><circle cx="1025.0" cy="387.0" r="11" fill="white" stroke="#bdc9d7"/><text x="1025.0" y="391.0" font-size="11" text-anchor="middle" font-weight="400">8</text><g data-node="UDeliveryConversationComponent"><title>UDeliveryConversationComponent</title><rect x="70" y="1090" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M71 1091 H409 V1170 H71 Z" fill="#eff4fb"/><text x="82" y="1108" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="398" y="1108" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="82" y="1133" font-size="18" text-anchor="start" font-weight="600">玩家交谈</text><text x="82" y="1155" font-size="12" text-anchor="start" font-weight="400">ConversationComponent</text><path d="M70 1170 H410 M70 1226 H410" stroke="#8aa5c6" stroke-width=".8"/><text x="82" y="1192" font-size="13" text-anchor="start" font-weight="400">位于玩家控制器上</text><text x="82" y="1212" font-size="13" text-anchor="start" font-weight="400">记录发言编号和发送间隔</text><text x="82" y="1249" font-size="13" text-anchor="start" font-weight="400">Submit()</text><text x="82" y="1266" font-size="12" text-anchor="start" font-weight="400">从玩家本机发送消息</text><text x="82" y="1287" font-size="13" text-anchor="start" font-weight="400">ServerSubmit()</text><text x="82" y="1304" font-size="12" text-anchor="start" font-weight="400">服务器检查后交给 NPC</text></g><g data-node="ADeliveryNpcCharacter"><title>ADeliveryNpcCharacter</title><rect x="445" y="420" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 421 H784 V500 H446 Z" fill="#eff4fb"/><text x="457" y="438" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="438" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="463" font-size="18" text-anchor="start" font-weight="600">NPC 角色</text><text x="457" y="485" font-size="12" text-anchor="start" font-weight="400">NpcCharacter</text><path d="M445 500 H785 M445 556 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="522" font-size="13" text-anchor="start" font-weight="400">创建决策、战斗和表现组件</text><text x="457" y="542" font-size="13" text-anchor="start" font-weight="400">保存当前执行的动作编号</text><text x="457" y="579" font-size="13" text-anchor="start" font-weight="400">HearSpeech()</text><text x="457" y="596" font-size="12" text-anchor="start" font-weight="400">接收玩家或其他 NPC 的话</text><text x="457" y="617" font-size="13" text-anchor="start" font-weight="400">ExecuteAction()</text><text x="457" y="634" font-size="12" text-anchor="start" font-weight="400">按动作类型调用相应功能</text></g><g data-node="ADeliveryNpcAIController"><title>ADeliveryNpcAIController</title><rect x="445" y="150" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 151 H784 V230 H446 Z" fill="#eff4fb"/><text x="457" y="168" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="168" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="193" font-size="18" text-anchor="start" font-weight="600">NPC 控制器</text><text x="457" y="215" font-size="12" text-anchor="start" font-weight="400">NpcAIController</text><path d="M445 230 H785 M445 286 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="252" font-size="13" text-anchor="start" font-weight="400">使用 UE 的视听感知</text><text x="457" y="272" font-size="13" text-anchor="start" font-weight="400">更新行为树需要的条件</text><text x="457" y="309" font-size="13" text-anchor="start" font-weight="400">OnTargetSeenOrHeard()</text><text x="457" y="326" font-size="12" text-anchor="start" font-weight="400">记录发现或失去目标的通知</text><text x="457" y="347" font-size="13" text-anchor="start" font-weight="400">RefreshBlackboard()</text><text x="457" y="364" font-size="12" text-anchor="start" font-weight="400">更新倒地、动作和目标信息</text></g><g data-node="UDeliveryAiGatewaySubsystem"><title>UDeliveryAiGatewaySubsystem</title><rect x="445" y="765" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M446 766 H784 V845 H446 Z" fill="#eff4fb"/><text x="457" y="783" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="773" y="783" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="457" y="808" font-size="18" text-anchor="start" font-weight="600">模型网络请求</text><text x="457" y="830" font-size="12" text-anchor="start" font-weight="400">AiGatewaySubsystem</text><path d="M445 845 H785 M445 901 H785" stroke="#8aa5c6" stroke-width=".8"/><text x="457" y="867" font-size="13" text-anchor="start" font-weight="400">保存排队和发送中的请求</text><text x="457" y="887" font-size="13" text-anchor="start" font-weight="400">记录超时与所属游戏世界</text><text x="457" y="924" font-size="13" text-anchor="start" font-weight="400">Enqueue()</text><text x="457" y="941" font-size="12" text-anchor="start" font-weight="400">把请求加入队列</text><text x="457" y="962" font-size="13" text-anchor="start" font-weight="400">Cancel()</text><text x="457" y="979" font-size="12" text-anchor="start" font-weight="400">取消这个 NPC 的请求</text></g><g data-node="UDeliveryNpcAgentComponent"><title>UDeliveryNpcAgentComponent</title><rect x="35" y="765" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M36 766 H374 V845 H36 Z" fill="#eff4fb"/><text x="47" y="783" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="363" y="783" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="47" y="808" font-size="18" text-anchor="start" font-weight="600">NPC 决策</text><text x="47" y="830" font-size="12" text-anchor="start" font-weight="400">NpcAgentComponent</text><path d="M35 845 H375 M35 901 H375" stroke="#8aa5c6" stroke-width=".8"/><text x="47" y="867" font-size="13" text-anchor="start" font-weight="400">保存所见所闻和当前请求</text><text x="47" y="887" font-size="13" text-anchor="start" font-weight="400">记录正在执行的动作</text><text x="47" y="924" font-size="13" text-anchor="start" font-weight="400">RequestDecision()</text><text x="47" y="941" font-size="12" text-anchor="start" font-weight="400">安排一次模型请求</text><text x="47" y="962" font-size="13" text-anchor="start" font-weight="400">StartAction()</text><text x="47" y="979" font-size="12" text-anchor="start" font-weight="400">检查条件并开始动作</text></g><g data-node="UBTTask_DeliveryExecuteNpcAction"><title>UBTTask_DeliveryExecuteNpcAction</title><rect x="855" y="420" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 421 H1194 V500 H856 Z" fill="#eff4fb"/><text x="867" y="438" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="1183" y="438" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="463" font-size="18" text-anchor="start" font-weight="600">动作执行任务</text><text x="867" y="485" font-size="12" text-anchor="start" font-weight="400">BTTask_ExecuteNpcAction</text><path d="M855 500 H1195 M855 556 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="522" font-size="13" text-anchor="start" font-weight="400">保存本次动作编号与目标</text><text x="867" y="542" font-size="13" text-anchor="start" font-weight="400">Fight 等待靠近、收拳与冷却</text><text x="867" y="579" font-size="13" text-anchor="start" font-weight="400">ExecuteTask()</text><text x="867" y="596" font-size="12" text-anchor="start" font-weight="400">开始执行行为树任务</text><text x="867" y="617" font-size="13" text-anchor="start" font-weight="400">TickFight()</text><text x="867" y="634" font-size="12" text-anchor="start" font-weight="400">检查次数、距离与停止条件</text></g><g data-node="DecisionServer / DecisionHandler"><title>DecisionServer / DecisionHandler</title><rect x="820" y="1090" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M821 1091 H1159 V1170 H821 Z" fill="#eff4fb"/><text x="832" y="1108" font-size="11" text-anchor="start" font-weight="400">«Python 类»</text><text x="1148" y="1108" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="832" y="1133" font-size="18" text-anchor="start" font-weight="600">AI 后端</text><text x="832" y="1155" font-size="12" text-anchor="start" font-weight="400">DecisionServer / DecisionHandler</text><path d="M820 1170 H1160 M820 1226 H1160" stroke="#8aa5c6" stroke-width=".8"/><text x="832" y="1192" font-size="13" text-anchor="start" font-weight="400">模型结束后可调用下一条请求</text><text x="832" y="1212" font-size="13" text-anchor="start" font-weight="400">本轮语音完成后再结束 HTTP 回复</text><text x="832" y="1249" font-size="13" text-anchor="start" font-weight="400">do_POST()</text><text x="832" y="1266" font-size="12" text-anchor="start" font-weight="400">接收请求、取消和逐句连接</text><text x="832" y="1287" font-size="13" text-anchor="start" font-weight="400">run_job() [模块函数]</text><text x="832" y="1304" font-size="12" text-anchor="start" font-weight="400">调用模型并安排语音合成</text></g><g data-node="UDeliveryNpcPresentationComponent"><title>UDeliveryNpcPresentationComponent</title><rect x="855" y="765" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 766 H1194 V845 H856 Z" fill="#eff4fb"/><text x="867" y="783" font-size="11" text-anchor="start" font-weight="400">«类»</text><text x="1183" y="783" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="808" font-size="18" text-anchor="start" font-weight="600">对白与人物表现</text><text x="867" y="830" font-size="12" text-anchor="start" font-weight="400">NpcPresentationComponent</text><path d="M855 845 H1195 M855 901 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="867" font-size="13" text-anchor="start" font-weight="400">安排逐句对白和客户端播放</text><text x="867" y="887" font-size="13" text-anchor="start" font-weight="400">管理声音、字幕、表情和动画</text><text x="867" y="924" font-size="13" text-anchor="start" font-weight="400">QueueSentence()</text><text x="867" y="941" font-size="12" text-anchor="start" font-weight="400">按序保存这次回复的句子</text><text x="867" y="962" font-size="13" text-anchor="start" font-weight="400">GetDisplayedSpeech()</text><text x="867" y="979" font-size="12" text-anchor="start" font-weight="400">读取本机实际播放的句子</text></g><g data-node="BT_Resident / BTT_ResidentExecute"><title>BT_Resident / BTT_ResidentExecute</title><rect x="855" y="150" width="340" height="226" fill="white" stroke="#8aa5c6"/><path d="M856 151 H1194 V230 H856 Z" fill="#eff4fb"/><text x="867" y="168" font-size="11" text-anchor="start" font-weight="400">«蓝图资产»</text><text x="1183" y="168" font-size="11" text-anchor="end" font-weight="400">已有代码</text><text x="867" y="193" font-size="18" text-anchor="start" font-weight="600">NPC 行为树</text><text x="867" y="215" font-size="12" text-anchor="start" font-weight="400">BT_Resident / BTT_ResidentExecute</text><path d="M855 230 H1195 M855 286 H1195" stroke="#8aa5c6" stroke-width=".8"/><text x="867" y="252" font-size="13" text-anchor="start" font-weight="400">保存各个行为分支</text><text x="867" y="272" font-size="13" text-anchor="start" font-weight="400">倒地时优先停止普通动作</text><text x="867" y="309" font-size="13" text-anchor="start" font-weight="400">选择动作分支</text><text x="867" y="326" font-size="12" text-anchor="start" font-weight="400">读取黑板中的条件</text><text x="867" y="347" font-size="13" text-anchor="start" font-weight="400">运行动作任务</text><text x="867" y="364" font-size="12" text-anchor="start" font-weight="400">交给 C++ 任务类执行</text></g><text x="35" y="1380" font-size="13" text-anchor="start" font-weight="400">01  服务器检查消息后交给 NPC</text><text x="645" y="1380" font-size="13" text-anchor="start" font-weight="400">02  控制 NPC 移动与朝向</text><text x="35" y="1406" font-size="13" text-anchor="start" font-weight="400">03  角色创建决策组件</text><text x="645" y="1406" font-size="13" text-anchor="start" font-weight="400">04  发送请求，接收模型回复</text><text x="35" y="1432" font-size="13" text-anchor="start" font-weight="400">05  通过 HTTP 传递 JSON 数据</text><text x="645" y="1432" font-size="13" text-anchor="start" font-weight="400">06  通过 NPC 角色发布对白</text><text x="35" y="1458" font-size="13" text-anchor="start" font-weight="400">07  开始动作并报告执行结果</text><text x="645" y="1458" font-size="13" text-anchor="start" font-weight="400">08  调用动作任务</text></svg>