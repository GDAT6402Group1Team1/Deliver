<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1030" viewBox="0 0 1260 1030">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#5a6b7d" stroke-width="1.2"/></marker></defs>
<style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#25384b;font-size:16px}.title{font-size:23px;font-weight:600}.name{font-size:17px;font-weight:600}.code{font-family:Consolas,monospace;font-size:15px}.small{font-size:14px;fill:#596b7e}.box{fill:white;stroke:#9dafc3}.head{fill:#edf3fa}.line{fill:none;stroke:#5a6b7d;stroke-width:1.5;marker-end:url(#arrow)}.divider{stroke:#c4d0dc}</style>
<rect width="1260" height="1030" fill="white"/>
<text x="36" y="36" class="title">持续行动、模型决定与语音播放</text>
<text x="36" y="62" class="small">类图 · 正在实施 · 模型调用与语音生成分别结束，实际动作仍由游戏服务器检查</text>
<rect x="24" y="92" width="1212" height="282" rx="8" fill="#f7f9fc" stroke="#dbe3ec"/>
<text x="42" y="118" class="name">Unreal Engine</text>
<g transform="translate(48 142)"><rect class="box" width="350" height="204"/><rect class="head" x="1" y="1" width="348" height="57"/><text class="name" x="16" y="25">NpcAgentComponent</text><text x="16" y="47" class="small">保存现场信息，安排 NPC 下一步行动</text><path class="divider" d="M0 58H350M0 112H350"/><text x="16" y="82">当前请求、行动和仍在接收的回复</text><text x="16" y="103">请求编号与回复编号分别保存</text><text class="code" x="16" y="139">RequestDecision()</text><text class="small" x="16" y="159">提交现场和本轮可选动作</text><text class="code" x="16" y="182">FinishModelReply()</text><text class="small" x="16" y="200">模型完成后允许下一次判断</text></g>
<g transform="translate(454 142)"><rect class="box" width="350" height="204"/><rect class="head" x="1" y="1" width="348" height="57"/><text class="name" x="16" y="25">AiGatewaySubsystem</text><text x="16" y="47" class="small">发送请求，接收动作建议和音频</text><path class="divider" d="M0 58H350M0 112H350"/><text x="16" y="82">按请求编号保存连接与截止时间</text><text x="16" y="103">旧音频不占新的模型请求名额</text><text class="code" x="16" y="139">Enqueue() / ReadStream()</text><text class="small" x="16" y="159">排队发送，逐条检查返回内容</text><text class="code" x="16" y="182">CancelRequest()</text><text class="small" x="16" y="200">只取消指定的一次请求</text></g>
<g transform="translate(860 142)"><rect class="box" width="350" height="204"/><rect class="head" x="1" y="1" width="348" height="57"/><text class="name" x="16" y="25">NpcPresentationComponent</text><text x="16" y="47" class="small">播放声音与字幕，控制人物表现</text><path class="divider" d="M0 58H350M0 112H350"/><text x="16" y="82">一条正在播放的回复，一条待播回复</text><text x="16" y="103">无台词续战保留原来的声音</text><text class="code" x="16" y="139">BeginReply() / QueueSentence()</text><text class="small" x="16" y="159">收下完整句，按播放顺序接替</text><text class="code" x="16" y="182">CancelSpeech()</text><text class="small" x="16" y="200">插话或倒地时停止声音与字幕</text></g>
<path class="line" d="M398 220H454"/><path class="line" d="M454 284H398"/>
<path class="line" d="M222 142V130H1035V142"/>
<text x="486" y="128" class="small">Agent 按回复编号把台词和声音交给表现组件</text>
<rect x="24" y="442" width="1212" height="554" rx="8" fill="#f7f9fc" stroke="#dbe3ec"/>
<text x="42" y="468" class="name">独立 AI 后端</text>
<path class="line" d="M608 346V488"/><path class="line" d="M648 488V346"/>
<text x="670" y="405" class="small">HTTP：model_done 结束模型等待</text><text x="670" y="425" class="small">后续音频继续发送，done 表示全部发送完</text>
<g transform="translate(454 488)"><rect class="box" width="350" height="166"/><rect class="head" x="1" y="1" width="348" height="57"/><text class="name" x="16" y="25">Scheduler / Job</text><text x="16" y="47" class="small">玩家优先，分别记录模型与声音进度</text><path class="divider" d="M0 58H350M0 90H350"/><text x="16" y="80">排队请求、取消通知、音频完成通知</text><text class="code" x="16" y="115">submit() / _finish_model()</text><text class="small" x="16" y="138">模型结束就继续处理下一次决定</text><text class="small" x="16" y="158">语音任务仍受数量与取消检查限制</text></g>
<path class="line" d="M520 654V696H223V738"/><path class="line" d="M630 654V738"/><path class="line" d="M740 654V696H1035V738"/>
<text x="120" y="722" class="small">正在进行的追打与逃跑</text><text x="527" y="722" class="small">交谈、初次挑衅及台词</text><text x="910" y="722" class="small">完整句子逐句合成</text>
<g transform="translate(48 738)"><rect class="box" width="350" height="222"/><rect class="head" x="1" y="1" width="348" height="57"/><text class="name" x="16" y="25">LocalCombatClient</text><text x="16" y="47" class="small">Qwen3-1.7B · 本机 GPU 优先</text><path class="divider" d="M0 58H350M0 115H350"/><text x="16" y="82">性格、原话、实际战况和合法候选</text><text x="16" y="104">只返回动作与当前对手</text><text class="code" x="16" y="143">choose()</text><text class="small" x="16" y="165">继续追打、逃跑或停手</text><text class="small" x="16" y="187">取消后确认本地推理已经退出</text><text class="small" x="16" y="209">失败或输入超限时交回原模型</text></g>
<g transform="translate(454 738)"><rect class="box" width="350" height="222"/><rect class="head" x="1" y="1" width="348" height="57"/><text class="name" x="16" y="25">AppServer</text><text x="16" y="47" class="small">Luna · 角色对话与复杂决定</text><path class="divider" d="M0 58H350M0 115H350"/><text x="16" y="82">复用常驻连接</text><text x="16" y="104">结合人物背景和最近发生的事</text><text class="code" x="16" y="143">stream()</text><text class="small" x="16" y="165">返回动作建议和完整短句</text><text class="small" x="16" y="187">动作建议仍须游戏服务器检查</text><text class="small" x="16" y="209">不按拱火次数强制攻击</text></g>
<g transform="translate(860 738)"><rect class="box" width="350" height="222"/><rect class="head" x="1" y="1" width="348" height="57"/><text class="name" x="16" y="25">QwenSpeechSynthesizer</text><text x="16" y="47" class="small">现有实现 / NativeQwen 候选</text><path class="divider" d="M0 58H350M0 115H350"/><text x="16" y="82">两位人物的 B 音色与固定采样配置</text><text x="16" y="104">通过同一 PCM 协议发送声音</text><text class="code" x="16" y="143">synthesize_stream()</text><text class="small" x="16" y="165">边生成边发送，后句可提前准备</text><text class="small" x="16" y="187">收到取消后停止对应声音</text><text class="small" x="16" y="209">听感与游戏负载对照后选择实现</text></g>
<text x="36" y="1020" class="small">图中省略 Delivery 前缀；行为树继续执行已选动作，模型只安排下一步，实际命中仍由游戏判定</text>
</svg>
